<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDA &amp; อบรม จบส.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#eef2f8; --card:#ffffff; --line:#e3e8f0; --ink:#1e293b; --muted:#64748b;
  --sda:#2563eb; --sda-soft:#dbeafe;
  --trn:#7c3aed; --trn-soft:#ede9fe;
  --gps:#0d9488; --gps-soft:#ccfbf1;
  --reg:#d97706; --reg-soft:#fef3c7;
  --ok:#059669; --ok-soft:#d1fae5;
  --warn:#d97706; --warn-soft:#fef3c7;
  --bad:#dc2626; --bad-soft:#fee2e2;
  --accent:var(--sda); --accent-soft:var(--sda-soft);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:linear-gradient(160deg,#eef2f8 0%,#e7ecf6 45%,#eaf0fa 100%);
  color:var(--ink); font-size:14px; min-height:100vh;
}
button,input,select{font-family:inherit;font-size:inherit}
a{color:var(--accent)}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;
  background:linear-gradient(140deg,#1e3a8a 0%,#3730a3 45%,#5b21b6 100%);}
.login-card{width:100%;max-width:390px;background:#fff;border-radius:18px;padding:26px 24px 22px;
  box-shadow:0 24px 60px rgba(15,23,42,.35)}
.login-card h1{margin:0 0 4px;font-size:21px;font-weight:700}
.login-card p.sub{margin:0 0 20px;color:var(--muted);font-size:13px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--sda);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 16px}
.check{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;cursor:pointer}
.btn-primary{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;font-weight:600;cursor:pointer;transition:transform .12s,filter .15s}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:active{transform:translateY(1px)}
.btn-primary[disabled]{opacity:.6;cursor:not-allowed}
.msg{margin-top:12px;font-size:13px;padding:9px 11px;border-radius:9px;display:none}
.msg.err{display:block;background:var(--bad-soft);color:#991b1b}
.msg.info{display:block;background:var(--sda-soft);color:#1e40af}

/* ---------- Shell ---------- */
#app{display:none;max-width:1500px;margin:0 auto;padding:14px 14px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;
  background:#fff;border-radius:var(--radius);padding:12px 16px;box-shadow:0 2px 14px rgba(15,23,42,.07);margin-bottom:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;
  background:linear-gradient(135deg,#2563eb,#7c3aed);font-size:13px}
.brand h1{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.brand .meta{font-size:11.5px;color:var(--muted)}
.userbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{background:#f1f5f9;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;color:#334155;max-width:260px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.scg{background:var(--ok-soft);border-color:#a7f3d0;color:#065f46}
.chip.vender{background:var(--warn-soft);border-color:#fde68a;color:#92400e}
.btn-ghost{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer;color:#334155}
.btn-ghost:hover{background:#f8fafc}

nav.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
nav.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#475569;border-radius:11px;
  padding:9px 16px;font-weight:600;cursor:pointer;transition:all .15s}
nav.tabs button.on{color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(37,99,235,.25)}
nav.tabs button.on[data-tab="sda"]{background:linear-gradient(135deg,#2563eb,#3b82f6)}
nav.tabs button.on[data-tab="training"]{background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 6px 16px rgba(124,58,237,.25)}
nav.tabs button.on[data-tab="gps"]{background:linear-gradient(135deg,#0d9488,#14b8a6);box-shadow:0 6px 16px rgba(13,148,136,.25)}
nav.tabs button.on[data-tab="reg"]{background:linear-gradient(135deg,#d97706,#f59e0b);box-shadow:0 6px 16px rgba(217,119,6,.25)}
nav.tabs button small{font-weight:400;opacity:.75;margin-left:6px}

.panel{background:#fff;border-radius:var(--radius);box-shadow:0 2px 14px rgba(15,23,42,.07);padding:14px;margin-bottom:12px}
.panel h2{margin:0 0 10px;font-size:15px;font-weight:600}

/* ---------- Filters ---------- */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.filters .f label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.filters .f select,.filters .f input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.filters .f select:focus,.filters .f input:focus{border-color:var(--accent)}
.filter-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.count-note{font-size:12.5px;color:var(--muted);margin-left:auto}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{border-radius:var(--radius);padding:13px 15px;color:#fff;box-shadow:0 4px 14px rgba(15,23,42,.12);min-height:82px}
.kpi .k-label{font-size:12px;opacity:.9;font-weight:400}
.kpi .k-value{font-size:24px;font-weight:700;line-height:1.25;margin-top:2px}
.kpi .k-note{font-size:11.5px;opacity:.85}
.k-blue{background:linear-gradient(135deg,#2563eb,#60a5fa)}
.k-violet{background:linear-gradient(135deg,#7c3aed,#c084fc)}
.k-green{background:linear-gradient(135deg,#059669,#34d399)}
.k-amber{background:linear-gradient(135deg,#d97706,#fbbf24)}
.k-red{background:linear-gradient(135deg,#dc2626,#f87171)}
.k-teal{background:linear-gradient(135deg,#0d9488,#2dd4bf)}
.k-slate{background:linear-gradient(135deg,#475569,#94a3b8)}

/* ---------- Sub tabs / chips ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;cursor:pointer;color:#475569;font-size:13px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chips.sub button.on{background:#475569;border-color:#475569}
.chips .lbl{font-size:12.5px;color:var(--muted);align-self:center;margin-right:2px}

/* ---------- Table ---------- */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;max-height:68vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:#f8fafc;border-bottom:1.5px solid var(--line);
  padding:9px 10px;text-align:left;font-weight:600;color:#334155;white-space:nowrap;cursor:pointer;user-select:none}
thead th.day{padding:8px 4px;text-align:center;min-width:26px;cursor:default;color:var(--muted);font-weight:500}
thead th .arrow{opacity:.45;font-size:10px;margin-left:3px}
tbody td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;max-width:220px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:nth-child(even){background:#fbfcfe}
tbody tr:hover{background:var(--accent-soft)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.mid{text-align:center}
td.day{text-align:center;padding:6px 2px;font-size:11px;min-width:26px;max-width:30px}
.d1{background:var(--ok-soft);color:#065f46;font-weight:600}
.d5{background:var(--warn-soft);color:#92400e;font-weight:600}
.d0{background:var(--bad-soft);color:#991b1b;font-weight:600}
.dn{color:#cbd5e1}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:#065f46}
.b-bad{background:var(--bad-soft);color:#991b1b}
.b-warn{background:var(--warn-soft);color:#92400e}
.b-mute{background:#f1f5f9;color:#475569}
.b-info{background:var(--sda-soft);color:#1e40af}
.bar{height:7px;border-radius:5px;background:#eef2f7;overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;border-radius:5px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding-top:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;cursor:pointer}
.pager button[disabled]{opacity:.4;cursor:not-allowed}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* ---------- Loader / popup ---------- */
#loader{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(238,242,248,.92)}
#loader .box{background:#fff;border-radius:14px;padding:22px 26px;box-shadow:0 14px 40px rgba(15,23,42,.18);text-align:center;max-width:340px}
.spin{width:30px;height:30px;border:3px solid var(--sda-soft);border-top-color:var(--sda);border-radius:50%;margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#cellpop{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);padding:20px}
#cellpop .box{background:#fff;border-radius:13px;padding:18px 20px;max-width:420px;width:100%;box-shadow:0 18px 44px rgba(15,23,42,.3)}
#cellpop .k{font-size:12px;color:var(--muted);margin-bottom:5px}
#cellpop .v{font-size:15px;font-weight:500;word-break:break-word}
#filepick{display:none;margin-top:14px}
.linkbtn{display:block;margin:11px auto 0;background:none;border:0;color:#6366f1;font-size:13px;cursor:pointer;text-decoration:underline}
.linkbtn:hover{color:#4338ca}
#pwmodal{position:fixed;inset:0;z-index:58;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.5);padding:18px}
#pwmodal .box{background:#fff;border-radius:16px;padding:22px 22px 18px;max-width:390px;width:100%;box-shadow:0 20px 50px rgba(15,23,42,.32)}
#pwmodal h3{margin:0 0 4px;font-size:18px;font-weight:700}
#pwmodal .sub{margin:0 0 16px;font-size:12.5px;color:var(--muted);line-height:1.6}
#pwmodal input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;outline:none}
#pwmodal input:focus{border-color:var(--sda);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.pwbtns{display:flex;gap:9px;margin-top:14px}
.pwbtns .btn-ghost{flex:1;padding:11px}
.pwbtns .btn-primary{flex:1.6}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:9px}
.legend span i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}

@media(max-width:640px){
  #app{padding:10px 9px 50px}
  .brand h1{font-size:15px}
  .kpi .k-value{font-size:20px}
  tbody td{max-width:130px;padding:7px 8px}
  .tablewrap{max-height:62vh}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>SDA &amp; อบรม จบส.</h1>
    <p class="sub">ระบบติดตามการใช้ SDA และการอบรม จบส. ของผู้รับเหมาขนส่ง</p>
    <div class="field">
      <label for="u">ผู้ใช้งาน</label>
      <input id="u" name="username" type="text" inputmode="text" autocomplete="username" placeholder="รหัส Vendor หรือชื่อผู้ใช้" required>
    </div>
    <div class="field">
      <label for="p">รหัสผ่าน</label>
      <input id="p" name="password" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" required>
    </div>
    <div class="row-between">
      <label class="check"><input type="checkbox" id="remember"> จำการเข้าสู่ระบบ</label>
      <span style="font-size:12px;color:#94a3b8" id="userStat">กำลังโหลดรายชื่อผู้ใช้…</span>
    </div>
    <button class="btn-primary" id="loginBtn" type="submit">เข้าสู่ระบบ</button>
    <button type="button" class="linkbtn" id="pwOpenLogin">เปลี่ยนรหัสผ่าน</button>
    <div class="msg" id="loginMsg"></div>
    <div id="filepick">
      <div class="field">
        <label for="xf">ไม่พบไฟล์ Excel ในโฟลเดอร์เดียวกัน — เลือกไฟล์เอง</label>
        <input id="xf" type="file" accept=".xlsx,.xls">
      </div>
    </div>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="mark">SDA</div>
      <div>
        <h1>SDA &amp; อบรม จบส.</h1>
        <div class="meta" id="srcMeta">—</div>
      </div>
    </div>
    <div class="userbox">
      <span class="chip" id="whoChip">—</span>
      <span class="chip" id="roleChip">—</span>
      <button class="btn-ghost" id="pwOpenApp">เปลี่ยนรหัสผ่าน</button>
      <button class="btn-ghost" id="reloadBtn" title="โหลดข้อมูลจากไฟล์ใหม่">โหลดใหม่</button>
      <button class="btn-ghost" id="logoutBtn">ออกจากระบบ</button>
    </div>
  </header>

  <nav class="tabs" id="tabbar"></nav>

  <section class="panel" id="filterPanel">
    <div class="filters" id="filters"></div>
    <div class="filter-actions">
      <button class="btn-ghost" id="clearBtn">ล้างตัวกรอง</button>
      <button class="btn-ghost" id="xlsxBtn">ดาวน์โหลด Excel</button>
      <span class="count-note" id="countNote"></span>
    </div>
  </section>

  <div class="kpis" id="kpis"></div>
  <div id="extra"></div>

  <section class="panel">
    <div id="subchips"></div>
    <div class="tablewrap" id="tablewrap"></div>
    <div class="pager" id="pager"></div>
    <div class="legend" id="legend"></div>
  </section>
</div>

<div id="loader"><div class="box"><div class="spin"></div><div id="loadText">กำลังโหลดข้อมูล…</div></div></div>
<div id="cellpop"><div class="box"><div class="k" id="popK"></div><div class="v" id="popV"></div></div></div>

<div id="pwmodal"><div class="box">
  <h3>เปลี่ยนรหัสผ่าน</h3>
  <p class="sub">รหัสผ่านใหม่จะถูกบันทึกลงกูเกิลชีตกลาง และใช้ได้กับทุกเว็บแอปที่ใช้รายชื่อผู้ใช้ชุดนี้</p>
  <div class="field"><label for="pwUser">ผู้ใช้งาน</label><input id="pwUser" type="text" autocomplete="username"></div>
  <div class="field"><label for="pwOld">รหัสผ่านเดิม</label><input id="pwOld" type="password" autocomplete="current-password"></div>
  <div class="field"><label for="pwNew">รหัสผ่านใหม่</label><input id="pwNew" type="password" autocomplete="new-password"></div>
  <div class="field"><label for="pwNew2">ยืนยันรหัสผ่านใหม่</label><input id="pwNew2" type="password" autocomplete="new-password"></div>
  <div class="msg" id="pwMsg"></div>
  <div class="pwbtns">
    <button type="button" class="btn-ghost" id="pwCancel">ยกเลิก</button>
    <button type="button" class="btn-primary" id="pwSave">บันทึกรหัสผ่านใหม่</button>
  </div>
</div></div>

<script>
/* =========================================================================
   ตั้งค่า — แก้ได้ 2 จุดนี้จุดเดียว
   ========================================================================= */
var EXCEL_FILE   = 'SDA-Traning-GPS-Register.xlsx';    // วางไว้โฟลเดอร์เดียวกับ index.html
var USER_SHEET   = '1VA8TtpoOXfnKLNsJiGmmv65iUhL4tYIFpUOKcJwJf_E'; // Google Sheet เก็บ user/password
var USER_CSV_URL = '';        // (แนะนำ) ลิงก์ CSV จากเมนู ไฟล์ > แชร์ > เผยแพร่ไปยังเว็บ > CSV
var LOCAL_CSV    = 'users.csv';   // สำรอง: ไฟล์ CSV ของชีต User วางโฟลเดอร์เดียวกับ index.html
var API_URL      = 'https://script.google.com/macros/s/AKfycbw6vA73LZOb0xS2Vx-rTGTgQcr0vL4PGP_VKLORuGdnWelgydS3Zo090QDLiqj9_lQN/exec';  // Apps Script (Code.gs) — ใช้ login + เปลี่ยนรหัสผ่าน
var LS_KEY       = 'sdaTrainingAuth_v2';

/* =========================================================================
   Utilities
   ========================================================================= */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function isDate(v){ return !!v && typeof v==='object' && typeof v.getTime==='function' && !isNaN(v.getTime()); }
function txt(v){
  if(v==null) return '';
  if(isDate(v)) return d2(v.getDate())+'/'+d2(v.getMonth()+1)+'/'+v.getFullYear();
  return String(v).trim();
}
/* อ่านค่าจากคอลัมน์ โดยยอมให้ชื่อหัวตารางต่างกันเล็กน้อย (เว้นวรรค/ขึ้นบรรทัด) */
function pick(row,names){
  for(var i=0;i<names.length;i++){ if(row[names[i]]!==undefined&&row[names[i]]!=='') return row[names[i]]; }
  var want=names.map(normKey);
  for(var k in row){ if(want.indexOf(normKey(k))>=0) return row[k]; }
  return '';
}
function d2(n){ return (n<10?'0':'')+n; }
function num(v){ var n=parseFloat(String(v==null?'':v).replace(/,/g,'')); return isNaN(n)?null:n; }
function pct(n){ return (Math.round(n*1000)/10).toFixed(1)+'%'; }
function nf(n){ return (n==null||isNaN(n))?'-':n.toLocaleString('en-US',{maximumFractionDigits:2}); }
function normKey(s){ return String(s==null?'':s).replace(/\s+/g,'').replace(/[.\-–—_]/g,'').toLowerCase(); }
function normUser(s){ return String(s==null?'':s).trim().replace(/[,\s]/g,'').toLowerCase(); }
function show(el,on){ el.style.display = on?'':'none'; }
function loader(on,t){ $('loader').style.display = on?'grid':'none'; if(t) $('loadText').textContent=t; }

/* CSV parser ที่รองรับ quote และขึ้นบรรทัดในเซลล์ */
function parseCSV(text){
  var rows=[],row=[],cur='',q=false,i=0;
  text = text.replace(/^\uFEFF/,'');
  while(i<text.length){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i+=2;continue;} q=false;i++;continue; }
      cur+=c;i++;continue;
    }
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(cur);cur='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';i++;continue;}
    cur+=c;i++;
  }
  row.push(cur); rows.push(row);
  return rows.filter(function(r){ return r.some(function(c){return String(c).trim()!=='';}); });
}

/* =========================================================================
   1) โหลดรายชื่อผู้ใช้จาก Google Sheet
   ========================================================================= */
var USERS = [], USER_SRC='', LOADLOG=[];

function rowsToUsers(rows){
  if(!rows||!rows.length) return null;
  var head = rows[0].map(function(h){ return normKey(h); });
  var iN=head.indexOf('name'), iU=head.indexOf('user'), iP=head.indexOf('password'), iS=head.indexOf('status');
  if(iU<0||iP<0) return null;
  var out=[];
  for(var r=1;r<rows.length;r++){
    var u=txt(rows[r][iU]); if(!u) continue;
    out.push({ name:txt(iN>=0?rows[r][iN]:''), user:u, pass:txt(rows[r][iP]),
               status:txt(iS>=0?rows[r][iS]:'').toUpperCase() });
  }
  return out.length?out:null;
}
function fetchCSVUsers(url,label){
  return fetch(url,{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(t){
      if(/^\s*<(!doctype|html)/i.test(t)) throw new Error('ได้หน้า HTML แทน CSV (ชีตอาจไม่เปิดสาธารณะ)');
      var us=rowsToUsers(parseCSV(t));
      if(!us) throw new Error('ไม่พบคอลัมน์ User/Password');
      LOADLOG.push('✓ '+label);
      return us;
    })
    .catch(function(e){ LOADLOG.push('✗ '+label+' — '+e.message); throw e; });
}
/* JSONP: ใช้ได้แม้เบราว์เซอร์บล็อก CORS หรือเปิดแบบ file:// */
function jsonpUsers(sheetName){
  var label='JSONP gviz'+(sheetName?' (sheet='+sheetName+')':'');
  return new Promise(function(resolve,reject){
    var cb='__gviz_'+Math.random().toString(36).slice(2);
    var s=document.createElement('script');
    var to=setTimeout(function(){ done(); LOADLOG.push('✗ '+label+' — หมดเวลา 10 วินาที'); reject(new Error('timeout')); },10000);
    function done(){ clearTimeout(to); try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(res){
      done();
      try{
        if(!res||!res.table) throw new Error('รูปแบบข้อมูลไม่ถูกต้อง');
        var rows=[res.table.cols.map(function(c){ return normKey(c.label||c.id); })];
        res.table.rows.forEach(function(r){
          rows.push(r.c.map(function(c){
            if(!c) return '';
            if(typeof c.v==='number') return String(c.v);   // กันรหัส Vendor ถูกแปลงเป็นตัวเลข
            return c.f!=null?c.f:(c.v!=null?c.v:'');
          }));
        });
        var us=rowsToUsers(rows);
        if(!us) throw new Error('ไม่พบคอลัมน์ User/Password');
        LOADLOG.push('✓ '+label); resolve(us);
      }catch(e){ LOADLOG.push('✗ '+label+' — '+e.message); reject(e); }
    };
    s.src='https://docs.google.com/spreadsheets/d/'+USER_SHEET+'/gviz/tq?tqx=out:json;responseHandler='+cb+
          '&headers=1'+(sheetName?'&sheet='+encodeURIComponent(sheetName):'');
    s.onerror=function(){ done(); LOADLOG.push('✗ '+label+' — เรียกไฟล์ไม่สำเร็จ'); reject(new Error('script error')); };
    document.head.appendChild(s);
  });
}
/* ไล่ลองทีละวิธีจนกว่าจะสำเร็จ */
function loadRemoteUsers(){
  var b='https://docs.google.com/spreadsheets/d/'+USER_SHEET;
  var tries=[];
  if(USER_CSV_URL) tries.push(function(){ return fetchCSVUsers(USER_CSV_URL,'CSV เผยแพร่ (ที่ตั้งค่าไว้)'); });
  tries.push(function(){ return fetchCSVUsers(b+'/gviz/tq?tqx=out:csv&headers=1','CSV gviz'); });
  tries.push(function(){ return fetchCSVUsers(b+'/gviz/tq?tqx=out:csv&headers=1&sheet=User','CSV gviz (sheet=User)'); });
  tries.push(function(){ return fetchCSVUsers(b+'/pub?output=csv','CSV เผยแพร่ /pub'); });
  tries.push(function(){ return fetchCSVUsers(b+'/pub?gid=0&single=true&output=csv','CSV เผยแพร่ /pub?gid=0'); });
  tries.push(function(){ return jsonpUsers(''); });
  tries.push(function(){ return jsonpUsers('User'); });
  var i=0;
  function next(){
    if(i>=tries.length) return Promise.reject(new Error('ทุกวิธีไม่สำเร็จ'));
    return tries[i++]().catch(function(){ return next(); });
  }
  return next();
}

function sheetRows(wb,name){

  if(!key) return [];
  var aoa=XLSX.utils.sheet_to_json(wb.Sheets[key],{header:1,raw:true,defval:''});

      var v=r[c];
      o[head[c]] = isDate(v)?v:txt(v);

/* วันที่อบรม / การจัดกลุ่มสถานะอบรม */
function trainingInfo(row){
  var raw = pick(row,['วันที่อบรม']);
  var code = txt(pick(row,['รหัส จบส.','จบส.']));
  var res  = txt(pick(row,['อบรม (ผ่าน/ไม่ผ่าน)','อบรม(ผ่าน/ไม่ผ่าน)','อบรม','ผลการอบรม']));
  var s = txt(raw);
  if(/ไม่มี\s*จบส/.test(s) || /ไม่มี\s*จบส/.test(code) || !code || code==='-')
    return {cat:'nojbs',label:'ไม่มี จบส.',deadline:'',dateText:'-'};
  var dt = isDate(raw) ? raw : (/^\d{4}-\d{1,2}-\d{1,2}/.test(s) ? new Date(s.slice(0,10)) : null);
  if(!dt && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){
    var q=s.split('/'); dt=new Date(parseInt(q[2],10),parseInt(q[1],10)-1,parseInt(q[0],10));
  }
  if(!dt){
    var m=s.match(/(\d{1,2})\s*\/\s*(\d{4})/);
    return {cat:'pending',label:'ยังไม่อบรม',deadline:m?(m[1]+'/'+m[2]):'ไม่ระบุกำหนด',dateText:s||'-'};
  }
  var dText=txt(dt);
  if(/ไม่ผ่าน/.test(res)) return {cat:'fail',label:'ไม่ผ่าน',deadline:'',dateText:dText};
  return {cat:'pass',label:'ผ่าน',deadline:'',dateText:dText};
}
function prepare(){
  DATA.Traning.forEach(function(r){
    var t=trainingInfo(r);
    r.__cat=t.cat; r.__catLabel=t.label; r.__deadline=t.deadline; r.__date=t.dateText;
    r.__group = (/^new$/i.test(txt(pick(r,['เข้างานปี 2026','เข้างานปี'])))) ? 'จบส.ใหม่' : 'จบส.เก่า';
  });
  DATA.SDA.forEach(function(r){
    var use=0,work=0;
    for(var d=1;d<=31;d++){
      var v=r[String(d)]; if(v==='' || v==null) continue;
      var n=num(v); if(n==null) continue;
      work++; use+=n;
    }
    var w=num(pick(r,['วันทำงาน (วัน)','วันทำงาน']));
    var p=num(pick(r,['%ใช้ SDA','%ใช้SDA']));
    r.__work = (w!=null? w : work);
    r.__pct  = (p!=null? p : (work? use/work : null));
    r.__use  = (r.__pct!=null? r.__work*r.__pct : use);
  });
}

  gps:{ label:'GPS', sheet:'GPS', accent:'--gps',

  reg:{ label:'ทะเบียนรถ', sheet:'registration', accent:'--reg',

        search:['เบอร์รถ','ทะเบียนรถ','ผู้รับเหมา','โรงงาน','ยี่ห้อรถ'],
        period:['Year','Month'] }
};
var STATE={ tab:'sda', f:{}, q:'', page:1, size:100, sort:null, dir:1,
            sub:'all', sub2:'all', sub3:'all', view:'row' };

/* ---------- ตัวกรอง ---------- */
function baseRows(){ return scoped(DATA[TABS[STATE.tab].sheet]||[]); }
function applyFilters(rows,skipKey){
  var cfg=TABS[STATE.tab], keys=(cfg.period||[]).concat(cfg.filters);
  return rows.filter(function(r){
    for(var i=0;i<keys.length;i++){
      var k=keys[i]; if(k===skipKey) continue;
      var v=STATE.f[k]; if(!v) continue;
      if(txt(r[k])!==v) return false;
    }
    if(STATE.q){
      var q=STATE.q.toLowerCase(), hit=false;
      for(var j=0;j<cfg.search.length;j++){
        if(txt(r[cfg.search[j]]).toLowerCase().indexOf(q)>=0){ hit=true; break; }
      }
      if(!hit) return false;
    }
    return true;
  });
}
function optionsFor(key){
  var rows=applyFilters(baseRows(),key), set={};
  rows.forEach(function(r){ var v=txt(r[key]); if(v) set[v]=1; });
  return Object.keys(set).sort(function(a,b){ return a.localeCompare(b,'th'); });
}
function renderFilters(){
  var cfg=TABS[STATE.tab], host=$('filters'), html='';
  (cfg.period||[]).concat(cfg.filters).forEach(function(k){
    var opts=optionsFor(k), cur=STATE.f[k]||'';
    html+='<div class="f"><label>'+esc(k)+'</label><select data-k="'+esc(k)+'"><option value="">ทั้งหมด</option>'+
      opts.map(function(o){ return '<option value="'+esc(o)+'"'+(o===cur?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+
      '</select></div>';

  html+='<div class="f"><label>ค้นหา</label><input id="qbox" type="search" placeholder="เบอร์รถ / ชื่อ / ทะเบียน" value="'+esc(STATE.q)+'"></div>';

/* ตั้งค่าเริ่มต้นของ ปี/เดือน จากข้อมูลที่ผู้ใช้เห็นเท่านั้น */
function defaultPeriod(){
  var cfg=TABS[STATE.tab]; if(!cfg.period) return;
  cfg.period.forEach(function(k){
    if(STATE.f[k]) return;
    var vals=optionsFor(k);
    if(vals.length===1) STATE.f[k]=vals[0];
    else if(k==='เดือน'||k==='Month'){
      var order=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var best=null,bi=-1;
      vals.forEach(function(v){ var i=order.indexOf(v); if(i>bi){bi=i;best=v;} });
      if(best) STATE.f[k]=best;
    }
  });
}

/* ---------- ตาราง ---------- */
function sortRows(rows,cols){
  if(!STATE.sort) return rows;
  var col=cols.filter(function(c){ return c.key===STATE.sort; })[0];
  if(!col) return rows;
  var d=STATE.dir;
  return rows.slice().sort(function(a,b){
    var va=col.val?col.val(a):a[col.key], vb=col.val?col.val(b):b[col.key];
    var na=num(va), nb=num(vb);
    if(na!=null&&nb!=null) return (na-nb)*d;
    return String(txt(va)).localeCompare(String(txt(vb)),'th')*d;
  });
}
var LAST={rows:[],cols:[]};
function drawTable(rows,cols,extraHead){
  var wrap=$('tablewrap');
  rows=sortRows(rows,cols);
  LAST={rows:rows,cols:cols};
  if(!rows.length){ wrap.innerHTML='<div class="empty">ไม่พบข้อมูลตามเงื่อนไขที่เลือก</div>'; $('pager').innerHTML=''; return; }
  var total=rows.length, size=STATE.size===0?total:STATE.size,
      pages=Math.max(1,Math.ceil(total/size));
  if(STATE.page>pages) STATE.page=pages;
  var start=(STATE.page-1)*size, slice=rows.slice(start,start+size);

  var h='<table><thead><tr>';
  cols.forEach(function(c){
    if(c.sortable===false){ h+='<th class="day">'+esc(c.label)+'</th>'; return; }
    var on=STATE.sort===c.key;
    h+='<th data-sort="'+esc(c.key)+'">'+esc(c.label)+'<span class="arrow">'+(on?(STATE.dir>0?'▲':'▼'):'↕')+'</span></th>';
  });
  h+=(extraHead||'')+'</tr></thead><tbody>';
  slice.forEach(function(r){
    h+='<tr>';
    cols.forEach(function(c){
      if(c.html) h+=c.html(r);
      else{
        var v=txt(c.val?c.val(r):r[c.key]);
        h+='<td class="'+(c.cls||'')+'" data-k="'+esc(c.label)+'" data-v="'+esc(v)+'">'+esc(v)+'</td>';
      }
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  wrap.innerHTML=h;

  wrap.querySelectorAll('th[data-sort]').forEach(function(th){
    th.addEventListener('click',function(){
      var k=th.getAttribute('data-sort');
      if(STATE.sort===k) STATE.dir=-STATE.dir; else { STATE.sort=k; STATE.dir=1; }
      render();
    });
  });
  wrap.querySelectorAll('td[data-v]').forEach(function(td){
    td.addEventListener('click',function(){
      if(td.scrollWidth<=td.clientWidth) return;
      $('popK').textContent=td.getAttribute('data-k')||'';
      $('popV').textContent=td.getAttribute('data-v')||'';
      $('cellpop').style.display='flex';
    });
  });

  var p=$('pager');
  p.innerHTML='แสดง '+(start+1).toLocaleString()+'–'+Math.min(start+size,total).toLocaleString()+' จาก '+total.toLocaleString()+' รายการ'+
    ' <select id="pgSize"><option value="50">50</option><option value="100">100</option><option value="200">200</option><option value="0">ทั้งหมด</option></select>'+
    ' <button id="pgPrev"'+(STATE.page<=1?' disabled':'')+'>ก่อนหน้า</button>'+
    ' <span>หน้า '+STATE.page+'/'+pages+'</span>'+
    ' <button id="pgNext"'+(STATE.page>=pages?' disabled':'')+'>ถัดไป</button>';
  $('pgSize').value=String(STATE.size);
  $('pgSize').addEventListener('change',function(){ STATE.size=parseInt(this.value,10); STATE.page=1; render(); });
  $('pgPrev').addEventListener('click',function(){ STATE.page--; render(); });
  $('pgNext').addEventListener('click',function(){ STATE.page++; render(); });
}

    kpi('k-red','ไม่ผ่าน',nf(c.fail),trained?pct(c.fail/trained)+' ของผู้เข้าอบรม':'') +

function render(){
  var cfg=TABS[STATE.tab];
  document.documentElement.style.setProperty('--accent','var('+cfg.accent+')');
  document.documentElement.style.setProperty('--accent-soft','var('+cfg.accent+'-soft)');
  $('extra').innerHTML='';
  renderFilters();
  var rows=applyFilters(baseRows());
  $('countNote').textContent='พบ '+nf(rows.length)+' รายการ';
  if(STATE.tab==='sda') renderSDA(rows);
  else if(STATE.tab==='training') renderTraining(rows);
  else if(STATE.tab==='gps') renderGPS(rows);
  else renderReg(rows);
  renderTabbar();
}
function renderTabbar(){
  var html='';
  Object.keys(TABS).forEach(function(k){
    var n=scoped(DATA[TABS[k].sheet]||[]).length;
    html+='<button data-tab="'+k+'" class="'+(STATE.tab===k?'on':'')+'">'+TABS[k].label+'<small>'+nf(n)+'</small></button>';
  });
  $('tabbar').innerHTML=html;
  $('tabbar').querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){
      STATE.tab=b.getAttribute('data-tab');
      STATE.f={}; STATE.q=''; STATE.page=1; STATE.sort=null; STATE.dir=1;
      STATE.sub='all'; STATE.sub2='all'; STATE.sub3='all'; STATE.view='row';
      defaultPeriod(); render();
    });
  });
}

/* ---------- ดาวน์โหลดเป็น Excel ให้หน้าตาเหมือนบนหน้าจอ ---------- */
var THEME_HEX={sda:'FF2563EB',training:'FF7C3AED',gps:'FF0D9488',reg:'FFD97706'};
function cellValue(c,r){
  var t = c.text? c.text(r) : (c.val? c.val(r) : r[c.key]);
  if(c.numType==='percent'||c.numType==='number'){
    var n=(typeof t==='number')?t:num(t); return (n==null||isNaN(n))?'':n;
  }
  if(c.cls==='num'){ var n2=num(txt(t)); return n2==null?txt(t):n2; }
  return txt(t);
}
function filterSummary(){
  var cfg=TABS[STATE.tab], parts=[];
  (cfg.period||[]).concat(cfg.filters).forEach(function(k){ if(STATE.f[k]) parts.push(k+': '+STATE.f[k]); });
  if(STATE.q) parts.push('ค้นหา: '+STATE.q);
  if(STATE.tab==='training'&&STATE.sub!=='all'){
    var m={pass:'ผ่าน',fail:'ไม่ผ่าน',pending:'ยังไม่อบรม',nojbs:'ไม่มี จบส.'};
    parts.push('สถานะ: '+(m[STATE.sub]||STATE.sub));
    if(STATE.sub==='pending'){
      if(STATE.sub2!=='all') parts.push('กลุ่ม: '+STATE.sub2);
      if(STATE.sub3!=='all') parts.push('กำหนดอบรมภายใน: '+STATE.sub3);
    }
  }
  if(STATE.tab==='sda'&&STATE.view!=='row') parts.push('มุมมอง: สรุปตาม'+STATE.view);
  return parts.length? parts.join('  ·  ') : 'ไม่ได้กรอง (ข้อมูลทั้งหมดที่เข้าถึงได้)';
}
function exportExcel(){
  if(!window.ExcelJS){ alert('โหลดไลบรารีสร้างไฟล์ Excel ไม่สำเร็จ — ตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่'); return; }
  var cols=LAST.cols, rows=LAST.rows;
  if(!rows.length){ alert('ไม่มีข้อมูลให้ดาวน์โหลด'); return; }
  loader(true,'กำลังสร้างไฟล์ Excel ('+nf(rows.length)+' แถว)…');

  setTimeout(function(){
    try{
      var tabLabel=TABS[STATE.tab].label, hex=THEME_HEX[STATE.tab]||'FF2563EB';
      var wb=new ExcelJS.Workbook();
      wb.creator='SDA & อบรม จบส.'; wb.created=new Date();
      var ws=wb.addWorksheet(tabLabel.replace(/[\\\/\?\*\[\]:]/g,' '),{
        views:[{state:'frozen',ySplit:4}],
        pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}
      });
      var last=cols.length, FONT='Tahoma';

      ws.mergeCells(1,1,1,last);
      var t1=ws.getCell(1,1);
      t1.value=tabLabel+' — SDA & อบรม จบส.';
      t1.font={name:FONT,size:14,bold:true,color:{argb:hex}};
      ws.getRow(1).height=22;

      ws.mergeCells(2,1,2,last);
      var t2=ws.getCell(2,1);
      t2.value=filterSummary();
      t2.font={name:FONT,size:9,color:{argb:'FF64748B'}};

      ws.mergeCells(3,1,3,last);
      var t3=ws.getCell(3,1);
      t3.value='ผู้ใช้: '+(SESSION?SESSION.name:'-')+'   ·   สิทธิ์: '+(SESSION&&SESSION.all?'SCG (ทุกผู้รับเหมา)':'ผู้รับเหมา')+
               '   ·   จำนวน '+nf(rows.length)+' รายการ   ·   สร้างเมื่อ '+new Date().toLocaleString('th-TH');
      t3.font={name:FONT,size:9,color:{argb:'FF64748B'}};

      var thin={style:'thin',color:{argb:'FFB8C4D9'}};
      var border={top:thin,left:thin,bottom:thin,right:thin};

      var hrow=ws.getRow(4);
      cols.forEach(function(c,i){
        var cell=hrow.getCell(i+1);
        cell.value=c.label;
        cell.font={name:FONT,size:10,bold:true,color:{argb:'FFFFFFFF'}};
        cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:hex}};
        cell.alignment={vertical:'middle',horizontal:'center',wrapText:true};
        cell.border=border;
      });
      hrow.height=26;

      rows.forEach(function(r,ri){
        var row=ws.getRow(5+ri);
        cols.forEach(function(c,ci){
          var cell=row.getCell(ci+1);
          cell.value=cellValue(c,r);
          var fill=c.fill? c.fill(r) : null;
          if(!fill && ri%2===1) fill='FFF7F9FC';
          if(fill) cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:fill}};
          var fc=c.fontColor? c.fontColor(r) : null;
          cell.font={name:FONT,size:10,color:{argb:fc||'FF1E293B'},bold:!!fc};
          var align = c.align || ((c.cls==='num')?'right':((c.cls==='mid'||c.cls==='day')?'center':'left'));
          cell.alignment={vertical:'middle',horizontal:align};
          cell.border=border;
          if(c.numType==='percent') cell.numFmt='0.0%';
          else if(typeof cell.value==='number') cell.numFmt='#,##0.##';
        });
        row.height=18;
      });

      cols.forEach(function(c,i){
        var w=c.width;
        if(!w){
          var len=String(c.label).length;
          for(var k=0;k<Math.min(rows.length,300);k++){
            var v=cellValue(c,rows[k]); len=Math.max(len,String(v==null?'':v).length);
          }
          w=Math.min(Math.max(len+2,7),34);
        }
        ws.getColumn(i+1).width=w;
      });

      ws.autoFilter={from:{row:4,column:1},to:{row:4+rows.length,column:last}};

      wb.xlsx.writeBuffer().then(function(buf){
        var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        var a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=tabLabel.replace(/\s/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
        loader(false);
      }).catch(function(err){ loader(false); alert('สร้างไฟล์ Excel ไม่สำเร็จ: '+err.message); });
    }catch(err){ loader(false); alert('สร้างไฟล์ Excel ไม่สำเร็จ: '+err.message); }
  },50);
}

$('logoutBtn').addEventListener('click',function(){
  localStorage.removeItem(LS_KEY); SESSION=null; $('pwmodal').style.display='none';
  $('app').style.display='none'; $('login').style.display='flex';

/* =========================================================================
   7) เข้าสู่ระบบ
   ========================================================================= */
function setMsg(t,cls){
  var m=$('loginMsg'); m.className='msg'+(cls?' '+cls:''); m.textContent=t;
  if(!t) m.style.display='none';
}
function startSession(u){
  SESSION={ name:u.name||u.user, code:u.user, status:u.status, all:/SCG/.test(u.status) };
  $('whoChip').textContent=SESSION.name;
  $('roleChip').textContent = SESSION.all? 'SCG — ดูได้ทุกผู้รับเหมา' : 'ผู้รับเหมา — เห็นเฉพาะข้อมูลของตนเอง';
  $('roleChip').className='chip '+(SESSION.all?'scg':'vender');
  STATE.tab='sda';
  $('login').style.display='none';
  $('app').style.display='block';
  afterData();
}
function afterData(){
  $('srcMeta').textContent = DATA.source+' · SDA '+nf(DATA.SDA.length)+' · อบรม '+nf(DATA.Traning.length)+
    ' · GPS '+nf(DATA.GPS.length)+' · ทะเบียน '+nf(DATA.registration.length)+
    ' · อัปเดต '+(DATA.loadedAt?DATA.loadedAt.toLocaleString('th-TH'):'-');
  STATE.f={}; STATE.q=''; STATE.page=1; STATE.sort=null;
  STATE.sub='all'; STATE.sub2='all'; STATE.sub3='all'; STATE.view='row';
  defaultPeriod();
  render();
}
function rememberCreds(u,p){
  if($('remember').checked){
    try{ localStorage.setItem(LS_KEY, btoa(unescape(encodeURIComponent(JSON.stringify({u:u,p:p}))))); }catch(e){}
  } else localStorage.removeItem(LS_KEY);
}
function localFind(u,p){
  return USERS.filter(function(x){ return normUser(x.user)===normUser(u) && String(x.pass).trim()===String(p).trim(); })[0];
}
/* ตรวจรหัสผ่าน: ใช้ Apps Script ก่อน ถ้าเรียกไม่ได้จึงเทียบกับรายชื่อที่โหลดไว้ */
function verifyLogin(u,p){
  if(!API_URL) return Promise.resolve({ok:!!localFind(u,p), local:true, hit:localFind(u,p)});
  return api({action:'login',user:u,pass:p}).then(function(res){
    if(res&&res.ok) return {ok:true, hit:{name:res.name||res.user||u, user:res.user||u, pass:p, status:res.status||''}};
    if(res&&res.error==='invalid') return {ok:false, message:res.message};
    var hit=localFind(u,p);
    return {ok:!!hit, hit:hit, message:(res&&res.message)||''};
  }).catch(function(){
    var hit=localFind(u,p);
    return {ok:!!hit, hit:hit, local:true};
  });
}
$('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  var u=$('u').value.trim(), p=$('p').value;
  if(!USERS.length&&!API_URL){ setMsg('ยังโหลดรายชื่อผู้ใช้ไม่สำเร็จ — ดูรายละเอียดด้านล่าง','err'); return; }
  $('loginBtn').disabled=true; $('loginBtn').textContent='กำลังตรวจสอบ…'; setMsg('','');
  verifyLogin(u,p).then(function(r){
    $('loginBtn').disabled=false; $('loginBtn').textContent='เข้าสู่ระบบ';
    if(!r.ok||!r.hit){ setMsg(r.message||'ผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง','err'); return; }
    if(!DATA.loadedAt){ setMsg('ยังโหลดไฟล์ Excel ไม่สำเร็จ — เลือกไฟล์ด้านล่างเพื่อใช้งานต่อ','err'); show($('filepick'),true); return; }
    rememberCreds(r.hit.user,p);
    setMsg('','');
    startSession(r.hit);
  });
});

/* ---------- เปลี่ยนรหัสผ่าน ---------- */
function pwMsg(t,cls){ var m=$('pwMsg'); m.className='msg'+(cls?' '+cls:''); m.textContent=t; if(!t) m.style.display='none'; }
function openPw(){
  $('pwUser').value = SESSION? SESSION.code : $('u').value.trim();
  $('pwOld').value=''; $('pwNew').value=''; $('pwNew2').value='';
  pwMsg('','');
  if(!API_URL) pwMsg('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html จึงยังเปลี่ยนรหัสผ่านไม่ได้','err');
  $('pwmodal').style.display='flex';
  setTimeout(function(){ ($('pwUser').value?$('pwOld'):$('pwUser')).focus(); },50);
}
$('pwOpenLogin').addEventListener('click',openPw);
$('pwOpenApp').addEventListener('click',openPw);
$('pwCancel').addEventListener('click',function(){ $('pwmodal').style.display='none'; });
$('pwmodal').addEventListener('click',function(e){ if(e.target===this) this.style.display='none'; });
$('pwSave').addEventListener('click',function(){
  var u=$('pwUser').value.trim(), o=$('pwOld').value, n=$('pwNew').value, n2=$('pwNew2').value;
  if(!u||!o||!n){ pwMsg('กรอกข้อมูลให้ครบทุกช่อง','err'); return; }
  if(n!==n2){ pwMsg('รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน','err'); return; }
  if(n.length<4){ pwMsg('รหัสผ่านใหม่ต้องยาวอย่างน้อย 4 ตัวอักษร','err'); return; }
  if(n===o){ pwMsg('รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม','err'); return; }
  $('pwSave').disabled=true; $('pwSave').textContent='กำลังบันทึก…'; pwMsg('กำลังบันทึกลงกูเกิลชีต…','info');
  api({action:'changePassword',user:u,pass:o,newpass:n}).then(function(res){
    $('pwSave').disabled=false; $('pwSave').textContent='บันทึกรหัสผ่านใหม่';
    if(!res||!res.ok){ pwMsg((res&&res.message)||'เปลี่ยนรหัสผ่านไม่สำเร็จ','err'); return; }
    var row=USERS.filter(function(x){ return normUser(x.user)===normUser(u); })[0];
    if(row) row.pass=n;
    var saved=localStorage.getItem(LS_KEY);
    if(saved){
      try{
        var o2=JSON.parse(decodeURIComponent(escape(atob(saved))));
        if(normUser(o2.u)===normUser(u)) localStorage.setItem(LS_KEY, btoa(unescape(encodeURIComponent(JSON.stringify({u:o2.u,p:n})))));
      }catch(e){}
    }
    pwMsg('เปลี่ยนรหัสผ่านเรียบร้อย ใช้รหัสใหม่ได้ทันทีกับทุกเว็บแอปที่ใช้รายชื่อผู้ใช้ชุดนี้','info');
    $('pwOld').value=''; $('pwNew').value=''; $('pwNew2').value='';
    setTimeout(function(){ $('pwmodal').style.display='none'; },2200);
  }).catch(function(err){
    $('pwSave').disabled=false; $('pwSave').textContent='บันทึกรหัสผ่านใหม่';
    pwMsg('เชื่อมต่อ Apps Script ไม่ได้ ('+err.message+') — ตรวจสอบ API_URL และการตั้งค่า Deploy เป็น Anyone','err');
  });
});

/* =========================================================================
   8) เริ่มระบบ
   ========================================================================= */
(function boot(){
  var okFile=false;
  function fail(){
    setUserStat();
    setMsg('อ่านรายชื่อผู้ใช้ไม่ได้ทั้งจากกูเกิลชีตและไฟล์ '+LOCAL_CSV+' ในโฟลเดอร์','err');
    var d=document.createElement('details');
    d.style.marginTop='10px'; d.style.fontSize='12.5px'; d.style.color='#64748b';
    d.innerHTML='<summary style="cursor:pointer">ดูรายละเอียดการเชื่อมต่อ</summary>'+
      '<div style="margin-top:7px;line-height:1.7">'+LOADLOG.map(esc).join('<br>')+
      '<br><br><b>วิธีแก้ที่เร็วที่สุด</b><br>' +
      '1) เปิดกูเกิลชีต User → ไฟล์ → ดาวน์โหลด → CSV<br>'+
      '2) เปลี่ยนชื่อไฟล์เป็น <b>'+esc(LOCAL_CSV)+'</b> แล้ววางไว้โฟลเดอร์เดียวกับ index.html บน GitHub<br>'+
      'หรือ: ไฟล์ → แชร์ → เผยแพร่ไปยังเว็บ → เลือกชีต User + CSV แล้วนำลิงก์มาใส่ในตัวแปร USER_CSV_URL</div>';
    var old=$('loginForm').querySelector('details'); if(old) old.remove();
    $('loginForm').appendChild(d);
  }
  function gotUsers(us,src){
    USERS=us; USER_SRC=src; setUserStat(); setMsg('','');
    var old=$('loginForm').querySelector('details'); if(old) old.remove();
    autoLogin();
  }
  var autoTried=false;
  function autoLogin(){
    if(!okFile||SESSION||autoTried) return;
    if(!USERS.length&&!API_URL) return;
    var saved=localStorage.getItem(LS_KEY); if(!saved) return;
    var o; try{ o=JSON.parse(decodeURIComponent(escape(atob(saved)))); }catch(e){ localStorage.removeItem(LS_KEY); return; }
    autoTried=true;
    verifyLogin(o.u,o.p).then(function(r){
      if(r.ok&&r.hit){ $('remember').checked=true; startSession(r.hit); }
      else localStorage.removeItem(LS_KEY);
    });
  }

  loadExcel().then(function(){ okFile=true; autoLogin(); })
             .catch(function(){ show($('filepick'),true); });

  var localDone=false, remoteDone=false;
  loadLocalUsers().then(function(us){
    localDone=true;
    if(!USERS.length) gotUsers(us,'ไฟล์ '+LOCAL_CSV);
  }).catch(function(){ localDone=true; if(remoteDone&&!USERS.length) fail(); });

  loadRemoteUsers().then(function(us){
    remoteDone=true; gotUsers(us,'กูเกิลชีต');
  }).catch(function(){ remoteDone=true; if(localDone&&!USERS.length) fail(); });
})();
</script>
