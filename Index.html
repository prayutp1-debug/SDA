<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDA &amp; อบรม จบส. — ศูนย์ติดตามผู้รับเหมา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --f-display:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --f-data:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --amber:#FFB020; --steel:#2E8BFF; --go:#22C55E; --stop:#FF4D4D; --violet:#8B5CF6;
  --cyan:#06B6D4; --pink:#EC4899;
  --r:4px; --rail-w:104px;
}
[data-theme="dark"]{
  --bg:#0E1319; --panel:#161D26; --panel-2:#1C2531; --line:#2A3542; --line-soft:#212B37;
  --ink:#E8EDF2; --ink-dim:#8698A9; --ink-faint:#5C6C7C; --accent-ink:#FFB020;
  --shadow:0 10px 30px rgba(0,0,0,.35); --grid:rgba(255,255,255,.045);
  --glow1:rgba(46,139,255,.16); --glow2:rgba(139,92,246,.14); --glow3:rgba(255,176,32,.09);
}
[data-theme="light"]{
  --bg:#EEF1F8; --panel:#FFFFFF; --panel-2:#F4F7F9; --line:#D7DFE7; --line-soft:#E6ECF1;
  --ink:#101820; --ink-dim:#5A6A79; --ink-faint:#8496A5; --accent-ink:#9A6500;
  --shadow:0 10px 24px rgba(16,24,32,.07); --grid:rgba(16,24,32,.05);
  --glow1:rgba(46,139,255,.10); --glow2:rgba(139,92,246,.09); --glow3:rgba(255,176,32,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1000px 520px at 6% -10%, var(--glow1), transparent 60%),
    radial-gradient(1000px 520px at 100% 4%, var(--glow2), transparent 60%),
    radial-gradient(800px 480px at 45% 115%, var(--glow3), transparent 60%),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,auto,auto,56px 56px,56px 56px;
  background-attachment:fixed;}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--amber);color:#0E1319}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hide{display:none !important}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(940px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr}
.login-brand{padding:40px 36px;border-right:1px solid var(--line);
  background:
    repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.05) 22px 23px),
    radial-gradient(520px 420px at 12% -10%, rgba(46,139,255,.55), transparent 60%),
    radial-gradient(520px 420px at 105% 15%, rgba(139,92,246,.5), transparent 60%),
    linear-gradient(155deg,#0B1330 0%,#132049 55%,#0E1B3D 100%);
  display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-brand *{color:#fff}
.login-brand .mark-txt{color:#B9C6E8}
.login-brand p{color:#B9C6E8}
.brand-meta span{color:#8FA3D6 !important}
.mark{display:flex;align-items:center;gap:10px}
.mark-dot{width:11px;height:11px;background:var(--amber);border-radius:1px;box-shadow:0 0 0 4px rgba(255,176,32,.14)}
.mark-txt{font-family:var(--f-display);font-weight:700;letter-spacing:.16em;font-size:11px;text-transform:uppercase;color:var(--ink-dim)}
.login-brand h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.18;margin:0 0 12px}
.login-brand h1 em{font-style:normal;color:var(--amber)}
.login-brand p{margin:0;color:var(--ink-dim);max-width:38ch}
.brand-meta{display:flex;gap:26px;flex-wrap:wrap}
.brand-meta span{display:block;font-family:var(--f-data);font-size:11px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;font-weight:500}
.brand-meta strong{font-family:var(--f-display);font-size:15px;font-weight:600}
.login-form{padding:40px 36px;display:flex;flex-direction:column;justify-content:center}
.login-form h2{font-family:var(--f-display);font-size:19px;margin:0 0 4px;font-weight:600}
.login-form .sub{color:var(--ink-dim);font-size:13px;margin:0 0 24px}
.field{margin-bottom:14px}
.field.pwfield{position:relative}
.field.pwfield input{padding-right:40px}
.eyebtn{position:absolute;right:1px;bottom:1px;width:38px;height:calc(100% - 2px);border:0;background:transparent;
  display:grid;place-items:center;color:var(--ink-faint);border-radius:0 var(--r) var(--r) 0}
.eyebtn:hover{color:var(--ink)}
.eyebtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.eyebtn .off{display:none}
.eyebtn.show .on{display:none}
.eyebtn.show .off{display:block}
.field label{display:block;font-family:var(--f-data);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;font-weight:500}
.field input,.field select{width:100%;padding:11px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r)}
.field input:focus{border-color:var(--amber);background:var(--panel);outline:none}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:10px 16px;border-radius:var(--r);font-weight:500}
.btn:hover{border-color:var(--ink-faint)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--amber);border-color:var(--amber);color:#12181F;font-weight:600}
.btn-primary:hover{filter:brightness(1.08)}
.btn-go{background:linear-gradient(135deg,#22C55E,#16A34A);border-color:transparent;color:#fff;font-weight:600}
.btn-go:hover{filter:brightness(1.08);border-color:transparent}
.btn-violet{background:linear-gradient(135deg,#8B5CF6,#7C3AED);border-color:transparent;color:#fff;font-weight:600}
.btn-violet:hover{filter:brightness(1.08);border-color:transparent}
.btn-block{width:100%;padding:12px}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-ghost{background:transparent}
.chkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 16px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-dim);cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--amber);margin:0;cursor:pointer}
.chk:hover{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;font-size:12.5px;color:var(--ink-faint);text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--stop)}
.login-alt{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.msg{border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:14px;border:1px solid}
.msg-err{background:rgba(255,107,90,.1);border-color:rgba(255,107,90,.4);color:var(--stop)}
.msg-info{background:rgba(76,155,232,.1);border-color:rgba(76,155,232,.35);color:var(--steel)}
.msg-warn{background:rgba(255,176,32,.1);border-color:rgba(255,176,32,.4);color:var(--accent-ink)}

/* shell */
#app{min-height:100vh;display:grid;grid-template-columns:var(--rail-w) 1fr}
.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;
  align-items:center;gap:6px;padding:16px 8px;position:sticky;top:0;height:100vh}
.rail .mark-dot{margin-bottom:14px}
.tabbtn{width:100%;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:14px 6px;
  display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-faint);position:relative}
.tabbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tabbtn span{font-family:var(--f-display);font-size:11.5px;font-weight:600;text-align:center;line-height:1.3}
.tabbtn:hover{color:var(--ink-dim);background:var(--panel-2)}
.tabbtn.on{color:var(--ink);background:var(--panel-2);border-color:var(--line)}
.tabbtn.on::before{content:"";position:absolute;left:-9px;top:14px;bottom:14px;width:3px;background:var(--amber)}
.tabbtn[data-tab="sda"].on{color:#fff;border-color:transparent;
  background:linear-gradient(135deg,#2E8BFF,#1D63D6);
  box-shadow:0 10px 22px -10px rgba(46,139,255,.65)}
.tabbtn[data-tab="tr"].on{color:#fff;border-color:transparent;
  background:linear-gradient(135deg,#8B5CF6,#6D28D9);
  box-shadow:0 10px 22px -10px rgba(139,92,246,.65)}
.tabbtn[data-tab="gps"].on{color:#fff;border-color:transparent;
  background:linear-gradient(135deg,#06B6D4,#0E7490);
  box-shadow:0 10px 22px -10px rgba(6,182,212,.65)}
.tabbtn[data-tab="reg"].on{color:#fff;border-color:transparent;
  background:linear-gradient(135deg,#22C55E,#15803D);
  box-shadow:0 10px 22px -10px rgba(34,197,94,.65)}
.tabbtn[data-tab="sda"].on::before,.tabbtn[data-tab="tr"].on::before,.tabbtn[data-tab="gps"].on::before,.tabbtn[data-tab="reg"].on::before{display:none}
.tabbtn.on:hover{filter:brightness(1.06)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;width:100%}
.icobtn{width:100%;aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);background:transparent;border-radius:var(--r);color:var(--ink-dim)}
.icobtn:hover{color:var(--ink);border-color:var(--ink-faint)}
.icobtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0}
.topbar .eyebrow{font-family:var(--f-data);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);display:block;font-weight:500}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);font-size:12.5px}
.chip.scope-vendor{border-color:rgba(255,176,32,.5);color:var(--accent-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--go)}
.dot.warn{background:var(--amber)}
.body{padding:22px 24px 60px;display:flex;flex-direction:column;gap:16px}

/* filters */
.filters{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px}
.filters-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filters-head .lbl{font-family:var(--f-data);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
.filters-head .spacer{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(166px,1fr));gap:10px}
/* ช่องค้นหาแยก 3 ช่อง วางเป็น grid item ปกติ ไม่กินเต็มแถว */
.fitem label{display:block;font-family:var(--f-data);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px;font-weight:500}
.fitem select,.fitem input{width:100%;padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);font-size:13px}
.fitem select:focus,.fitem input:focus{border-color:var(--amber);outline:none}
.fitem.active select{border-color:var(--amber);background:rgba(255,176,32,.07)}
.fitem.search{position:relative}
.fitem.search label{color:var(--steel);font-weight:700}
.fitem.search input{
  border:2px solid var(--steel);
  background:var(--panel);
  color:var(--ink);
  font-weight:600;
  padding:11px 14px 11px 34px;
  font-size:14px;
  box-shadow:0 0 0 3px rgba(76,155,232,.12);
}
.fitem.search input::placeholder{color:var(--ink-faint);font-weight:400}
.fitem.search input:focus{border-color:var(--steel);box-shadow:0 0 0 4px rgba(76,155,232,.22);outline:none}
.fitem.search::after{
  content:"";position:absolute;left:12px;bottom:13px;width:15px;height:15px;pointer-events:none;
  background:var(--steel);
  -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>') center/contain no-repeat;
  mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>') center/contain no-repeat;
}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0;background:var(--kpi-tint,transparent);pointer-events:none}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink-faint)}
.kpi.k-all{--kpi-tint:linear-gradient(135deg,rgba(46,139,255,.10),transparent 72%)}
.kpi.k-all::after{background:var(--steel)}
.kpi.k-go{--kpi-tint:linear-gradient(135deg,rgba(34,197,94,.11),transparent 72%)}
.kpi.k-go::after{background:var(--go)}
.kpi.k-stop{--kpi-tint:linear-gradient(135deg,rgba(255,77,77,.11),transparent 72%)}
.kpi.k-stop::after{background:var(--stop)}
.kpi.k-alt{--kpi-tint:linear-gradient(135deg,rgba(139,92,246,.11),transparent 72%)}
.kpi.k-alt::after{background:var(--violet)}
.kpi.k-amber{--kpi-tint:linear-gradient(135deg,rgba(255,176,32,.13),transparent 72%)}
.kpi.k-amber::after{background:var(--amber)}
.kpi .t{font-family:var(--f-data);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;font-weight:500}
.kpi .v{font-family:var(--f-display);font-size:29px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--ink-dim);margin-top:6px}

/* gauge */
.gauge-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.gauge-top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.gauge-top .cap{font-family:var(--f-data);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
.gauge-top .big{font-family:var(--f-display);font-size:52px;font-weight:700;line-height:.9;letter-spacing:-.03em}
.gauge-top .big i{font-style:normal;font-size:22px;color:var(--ink-dim);margin-left:2px}
.gauge-legend{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-dim)}
.gauge-legend i{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:6px}
.ticks{display:flex;gap:3px;align-items:flex-end;height:46px}
.ticks .tk{flex:1;background:var(--line);border-radius:1px;height:16px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.ticks .tk.f{height:40px}
.ticks .tk.f5{height:46px}
.ticks .tk.mk{background:var(--ink) !important;height:46px}
.scale{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--f-data);font-size:10px;color:var(--ink-faint)}

/* panels */
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h3{font-family:var(--f-display);font-size:14.5px;font-weight:600;margin:0}
.panel-head h3{display:flex;align-items:center;gap:8px}
.tone{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.tone.t-stop{background:var(--stop)}
.tone.t-go{background:var(--go)}
.tone.t-amber{background:var(--amber)}
.panel-head .spacer{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.note{font-family:var(--f-data);font-size:11px;color:var(--ink-faint)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12px;color:var(--ink-dim)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--panel-2);color:var(--ink);font-weight:600}

.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:minmax(96px,158px) 1fr auto;gap:12px;align-items:center}
.bar-row .nm{font-size:12.5px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:16px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:2px;display:flex;overflow:hidden}
.bar-track i{display:block;height:100%;transition:width .55s cubic-bezier(.22,1,.36,1)}
.bar-row .nums{font-family:var(--f-data);font-size:11.5px;font-weight:500;color:var(--ink-dim);white-space:nowrap}
.bar-row .nums b{color:var(--ink);font-weight:600}

.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:146px;height:146px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:25px;background:var(--panel);border-radius:50%}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:2}
.donut .mid b{font-family:var(--f-display);font-size:24px;font-weight:700;display:block;line-height:1}
.donut .mid span{font-family:var(--f-data);font-size:10px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;font-weight:500}
.dl{display:flex;flex-direction:column;gap:11px;min-width:148px;flex:1}
.dl .r{display:flex;align-items:center;gap:9px;font-size:13px}
.dl .r i{width:10px;height:10px;border-radius:2px;flex:none}
.dl .r b{margin-left:auto;font-family:var(--f-data);font-weight:600}

/* daily trend */
.trend{display:flex;gap:3px;align-items:flex-end;height:112px}
.tcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:0;min-width:0;position:relative}
.tcol i{display:block;width:100%}
.tcol .n{background:var(--stop);opacity:.78}
.tcol .u{background:var(--go)}
.tcol:hover i{filter:brightness(1.25)}
.tlabels{display:flex;gap:3px;margin-top:6px}
.tlabels span{flex:1;text-align:center;font-family:var(--f-data);font-size:9px;color:var(--ink-faint);min-width:0;overflow:hidden}

/* ค่าใช้จ่ายราย Vendor — แท่งเดียวซ้อนหลายยี่ห้อ */
.vrow{display:grid;grid-template-columns:minmax(150px,230px) 1fr auto;gap:14px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line-soft)}
.vrow:last-child{border-bottom:0}
.vname{min-width:0}
.vname b{display:block;font-size:13px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vname small{font-family:var(--f-data);font-size:10.5px;color:var(--ink-faint)}
.vstack{height:20px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:3px;
  display:flex;overflow:hidden}
.vstack i{display:block;height:100%;transition:width .55s cubic-bezier(.22,1,.36,1);position:relative}
.vstack i:hover{filter:brightness(1.15)}
.vtot{font-family:var(--f-data);font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;text-align:right}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.vchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-data);font-size:10.5px;color:var(--ink-dim)}
.vchip i{width:8px;height:8px;border-radius:2px;flex:none}
/* ความสูงสำรองราว 5 แถว — ใช้ทันทีตั้งแต่เรนเดอร์ ไม่ต้องรอ JS

  const N=cols.map(c=>({raw:c,n:norm(c)}));

const NEG=["ยังไม่","ไม่ได้","ไม่เคย","ไม่ผ่าน","ไม่มี","ไม่ใช้","ไม่","notyet","no","never","pending","waiting","รอ","ค้าง","ขาด","inactive","unused","false","expired","หมดอายุ"];
const POS=["แล้ว","ใช้งาน","active","used","yes","ผ่าน","complete","done","finish","สำเร็จ","เรียบร้อย","ครบ","true","ok","pass","มี"];
function isDone(v){
  const s=String(v??"").trim().toLowerCase();
  if(!s||s==="-"||s==="0"||s==="n"||s==="x"||s==="false")return false;
  if(s==="1"||s==="y"||s==="true"||s==="✓")return true;
  for(const t of NEG) if(s.includes(t)) return false;
  for(const t of POS) if(s.includes(t)) return true;
  return !!parseDate(s);
}
function parseDate(v){
  const s=String(v??"").trim(); if(!s) return null;
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;if(y>2400)y-=543;const d=new Date(y,+m[2]-1,+m[1]);return isNaN(d)?null:d;}
  m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m){let y=+m[1];if(y>2400)y-=543;const d=new Date(y,+m[2]-1,+m[3]);return isNaN(d)?null:d;}
  m=s.match(/^(\d{1,2})\s*([ก-๙.]+)\s*(\d{2,4})$/);
  if(m){
    const TH=["ม.ค","ก.พ","มี.ค","เม.ย","พ.ค","มิ.ย","ก.ค","ส.ค","ก.ย","ต.ค","พ.ย","ธ.ค"];
    const i=TH.findIndex(t=>m[2].startsWith(t));
    if(i<0) return null;
    let y=+m[3]; if(y<100)y+=2500; if(y>2400)y-=543;
    return new Date(y,i,+m[1]);
  }
  if(/[ก-๙]/.test(s)) return null;
  /* รูปแบบที่มีแค่ "ปี-เดือน" หรือ "เดือน/ปี" (ไม่มีเลขวันที่) ไม่ถือเป็นวันที่ที่อบรมจริง
     แต่เป็น "กำหนดต้องอบรมภายในเดือนนั้น" — คืน null เพื่อให้ deadlineInfo ไปอ่านเป็นเดือนแทน
     กันไม่ให้ new Date("2026-11") ถูกตีความเป็น 1 พ.ย. 2026 แล้วนับว่าอบรมแล้ว */
  if(/^\d{4}\s*[\/\-.]\s*\d{1,2}$/.test(s)) return null;
  if(/^\d{1,2}\s*[\/\-.]\s*\d{4}$/.test(s)) return null;
  const d=new Date(s); return isNaN(d)?null:d;
}
function vendorKey(v){ return String(v??"").trim().toUpperCase().replace(/[\s\-]/g,"").replace(/^0+/,""); }
function num(v){ const n=parseFloat(String(v??"").replace(/[^0-9.\-]/g,"")); return isNaN(n)?null:n; }
/* ช่องวันที่ 1–31 ในชีท SDA
   รูปแบบใหม่: ตัวเลข 0–1 = สัดส่วนการใช้ SDA ของวันนั้น (ว่าง = ไม่ใช่วันทำงาน)
   รูปแบบเก่า: ตัวอักษร M = ใช้ / W = ไม่ใช้ — ยังรองรับไว้เผื่อชีทเดิม */
function dayVal(v){
  const s=String(v??"").trim();
  if(!s||s==="-") return {kind:"blank",v:0};
  if(/^-?\d*\.?\d+$/.test(s)){ const n=parseFloat(s); return {kind:"num",v:Math.max(0,Math.min(1,n))}; }
  const t=s.toUpperCase();
  if(t==="M") return {kind:"M",v:1};
  if(t==="W") return {kind:"W",v:0};
  return {kind:"other",v:0};
}

/* ===================== LOADING ===================== */
let jsonpSeq=0;
function jsonp(url,timeout){
  return new Promise((res,rej)=>{
    const cb="cb"+(++jsonpSeq)+"x"+Date.now();
    const el=document.createElement("script");
    let done=false;
    const cleanup=()=>{clearTimeout(tm);try{delete window[cb];}catch(e){window[cb]=undefined;}if(el.parentNode)el.parentNode.removeChild(el);};
    const tm=setTimeout(()=>{if(done)return;done=true;cleanup();rej(new Error("หมดเวลารอการตอบกลับ"));},timeout||25000);
    window[cb]=o=>{if(done)return;done=true;cleanup();res(o);};
    el.onerror=()=>{if(done)return;done=true;cleanup();rej(new Error("เรียกข้อมูลไม่สำเร็จ"));};
    el.src=url+(url.includes("?")?"&":"?")+"callback="+cb;
    document.head.appendChild(el);
  });
}
/* --- Apps Script API --- */
async function apiRaw(params,timeout){
  if(!CFG.apiUrl) throw new Error("ยังไม่ได้ตั้งค่า URL ของ Apps Script");
  const q=new URLSearchParams(params).toString();
  return await jsonp(CFG.apiUrl+(CFG.apiUrl.includes("?")?"&":"?")+q,timeout||40000);
}
async function api(params){
  const o=await apiRaw(params);
  if(!o||!o.ok) throw new Error((o&&o.error)||"API ตอบกลับผิดพลาด");
  return o;
}
/* เรียก Apps Script เพื่อดูว่ายังตอบอยู่ไหม — ตอบ ok:false ก็ถือว่ายังมีชีวิต
   ลองสูงสุด 2 ครั้ง เพราะ Apps Script บางทีตื่นช้า (cold start) โดยเฉพาะเครือข่ายองค์กร
   ที่ผ่าน proxy/ไฟร์วอลล์ ทำให้รอบแรกอาจช้ากว่าปกติมาก */
async function apiAlive(onRetry){
  try{ const o=await apiRaw({action:"ping"},18000); return !!o; }
  catch(e){
    if(onRetry) onRetry();
    try{ const o2=await apiRaw({action:"ping"},18000); return !!o2; }
    catch(e2){ return false; }
  }
}
/* --- gviz (อ่านอย่างเดียว) --- */
function gvizBase(){ return "https://docs.google.com/spreadsheets/d/"+CFG.sheetId+"/gviz/tq?"; }
function dedupeCols(list){
  const seen=new Set();
  return list.map((c,i)=>{ let l=String(c).trim()||("คอลัมน์ "+(i+1)); while(seen.has(l)) l+=" "; seen.add(l); return l; });
}
function parseCSV(text){
  const out=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===",") { row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); out.push(row); row=[]; cell=""; }
    else if(c!=="\r") cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); out.push(row); }
  return out;
}
function shapeCSV(text){
  const t=parseCSV(text);
  if(!t.length) throw new Error("ไม่มีข้อมูล");
  const cols=dedupeCols(t[0]);
  const rows=t.slice(1).map(r=>{const o={};cols.forEach((c,i)=>o[c]=String(r[i]??"").trim());return o;})
    .filter(r=>Object.values(r).some(v=>v!==""));
  return {cols,rows};
}
function shapeGviz(o){
  if(o&&o.status==="error"){ const r=(o.errors&&o.errors[0])||{}; throw new Error(r.detailed_message||r.message||"ไม่พบชีทนี้"); }
  if(!o||!o.table) throw new Error("ไม่พบตาราง");
  const cols=dedupeCols(o.table.cols.map(c=>c.label||""));
  const rows=(o.table.rows||[]).map(r=>{
    const obj={};
    cols.forEach((c,i)=>{
      const cell=r.c?r.c[i]:null;
      let v=""; if(cell) v=(cell.f!=null&&cell.f!=="")?cell.f:(cell.v!=null?cell.v:"");
      obj[c]=String(v).trim();
    });
    return obj;
  }).filter(r=>Object.values(r).some(v=>v!==""));
  return {cols,rows};
}
/* gviz ต้องการชื่อ callback ใน URL จึงต้องต่อเอง */
function jsonpGviz(name){
  return new Promise((res,rej)=>{
    const cb="gv"+(++jsonpSeq)+"x"+Date.now();
    const el=document.createElement("script");
    let done=false;
    const cleanup=()=>{clearTimeout(tm);try{delete window[cb];}catch(e){window[cb]=undefined;}if(el.parentNode)el.parentNode.removeChild(el);};
    const tm=setTimeout(()=>{if(done)return;done=true;cleanup();rej(new Error("หมดเวลารอ — ตรวจสิทธิ์แชร์ของชีท"));},25000);
    window[cb]=o=>{if(done)return;done=true;cleanup();try{res(shapeGviz(o));}catch(e){rej(e);}};
    el.onerror=()=>{if(done)return;done=true;cleanup();rej(new Error("เข้าถึงชีทไม่ได้"));};
    el.src=gvizBase()+"tqx=out:json;responseHandler:"+cb+"&headers=1&sheet="+encodeURIComponent(name);
    document.head.appendChild(el);
  });
}
async function loadSheet(cands){
  let last=null;
  for(const n of cands){
    try{
      const q="headers=1&sheet="+encodeURIComponent(n);
      try{
        const r=await fetch(gvizBase()+"tqx=out:csv&"+q,{credentials:"omit"});
        if(r.ok){ const t=await r.text(); if(!/^\s*<!DOCTYPE|^\s*<html/i.test(t)){ const d=shapeCSV(t); if(d.cols.length) return d; } }
      }catch(e){}
      const d=await jsonpGviz(n);
      if(d.cols.length) return d;
    }catch(e){ last=e; }
  }
  throw last||new Error("โหลดไม่สำเร็จ");
}
async function loadAllGviz(){
  const [u,s,t,g,rg]=await Promise.allSettled([loadSheet(CFG.names.user),loadSheet(CFG.names.sda),
    loadSheet(CFG.names.tr),loadSheet(CFG.names.gps),loadSheet(CFG.names.reg)]);
  const out={user:u.status==="fulfilled"?u.value:null,sda:s.status==="fulfilled"?s.value:null,
             tr:t.status==="fulfilled"?t.value:null,gps:g.status==="fulfilled"?g.value:null,
             reg:rg.status==="fulfilled"?rg.value:null};
  if(!out.user&&!out.sda&&!out.tr&&!out.gps&&!out.reg){ const e=[u,s,t,g,rg].find(x=>x.status==="rejected"); throw (e&&e.reason)||new Error("เชื่อมต่อไม่ได้"); }
  return out;
}

/* ===================== PREPARE ===================== */
function prepare(){
  S.map.user={};
  for(const k in USER_CAND) S.map.user[k]=findCol(S.data.user.cols,USER_CAND[k]);
  ["sda","tr","gps","reg"].forEach(ds=>{
    const cols=S.data[ds].cols;
    const grid=(ds==="gps"||ds==="reg");
    const dayCols=grid?[]:cols.filter(c=>{const n=String(c).trim();return /^\d{1,2}$/.test(n)&&+n>=1&&+n<=31;});
    const profile=ds==="gps"?"cost":ds==="reg"?"registry":(dayCols.length>=15?"daily":"status");
    const metaCols=cols.filter(c=>!dayCols.includes(c));
    S.meta[ds]={profile,dayCols,metaCols};
    const m={};
    for(const k in CAND) m[k]=findCol(metaCols,CAND[k]);
    const taken=new Set();
    MAP_PRIORITY.forEach(k=>{ if(!m[k])return; if(taken.has(m[k])) m[k]=""; else taken.add(m[k]); });
    if(profile==="daily") m.status="";
    S.map[ds]=m;
    if(profile==="daily"){
      S.data[ds].rows.forEach(r=>{
        let u=0,w=0,o=0;
        for(const c of dayCols){
          const d=dayVal(r[c]);
          if(d.kind==="blank") continue;
          if(d.kind==="num"){ u+=d.v; w++; }
          else if(d.kind==="M"){ u++; w++; }
          else if(d.kind==="W"){ w++; }
          else o++;
        }
        u=Math.round(u*1000)/1000;
        r.__u=u;r.__w=w;r.__n=Math.round((w-u)*1000)/1000;r.__o=o;
      });
    }
    if(profile==="cost"){
      /* แปลงค่าใช้จ่ายเป็นตัวเลขไว้ล่วงหน้า (ตัดเครื่องหมายคอมมา/สัญลักษณ์สกุลเงินออก) */
      S.data[ds].rows.forEach(r=>{ r.__cost = m.cost ? (num(r[m.cost])||0) : 0; });
    }
  });
}
/* เลือกช่วงเวลาล่าสุดให้อัตโนมัติ โดยดูจากข้อมูลที่ผู้ใช้คนนี้เห็นได้จริง */
function defaultPeriod(ds){
  const u=S.ui[ds]; if(u.inited) return; u.inited=true;
  if(S.meta[ds].profile!=="daily") return;
  const m=S.map[ds], rows=scopedRows(ds);
  if(m.year){
    const ys=Array.from(new Set(rows.map(r=>keyNorm(r[m.year])).filter(Boolean)));
    if(ys.length>1){ ys.sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true})); u.f.year=ys[ys.length-1]; }
  }
  if(m.month){
    const ms=Array.from(new Set(rows.filter(r=>!u.f.year||keyNorm(r[m.year])===u.f.year).map(r=>keyNorm(r[m.month])).filter(Boolean)));
    if(ms.length>1){ ms.sort((a,b)=>MONTHS.indexOf(a.slice(0,3))-MONTHS.indexOf(b.slice(0,3))); u.f.month=ms[ms.length-1]; }
  }
}
/* ทิ้งค่าตัวกรองที่ไม่มีอยู่จริงในข้อมูลของผู้ใช้คนนี้ */
function healFilters(ds){
  const m=S.map[ds], f=S.ui[ds].f, rows=scopedRows(ds);
  for(const k of dimsFor(ds)){
    if(!f[k]) continue;
    if(!rows.some(r=>keyNorm(r[m[k]])===f[k])) delete f[k];
  }
}

  startSession({user:u,pw:p,name:String(hit[um.name]||u).trim()||u,status:st||"SCG",isVendor,vendorNo:vno});
}

/* ===================== FILTER / AGG ===================== */
const DIM_LABEL={year:"ปี",month:"เดือน",biz:"กิจการ",region:"ภาค",dept:"แผนก",plant:"โรงงาน",size:"ขนาดรถ",account:"บัญชี",contractor:"ผู้รับเหมา",course:"หลักสูตร",entry:"เข้างาน",brand:"ยี่ห้อ GPS",vstatus:"สถานะรถ",vtype:"ประเภทรถ"};
const DIM_ORDER=["year","month","biz","region","dept","plant","contractor","account","size","vtype","vstatus","entry","brand","course"];
function dimsFor(ds){ return DIM_ORDER.filter(k=>!!S.map[ds][k]); }
function chartDims(ds){ return dimsFor(ds).filter(k=>k!=="year"&&k!=="month"); }

function scopedRows(ds){
  const rows=S.data[ds].rows, m=S.map[ds], s=S.session;
  if(!s||!s.isVendor) return rows;
  const want=vendorKey(s.vendorNo);
  if(m.vendorNo){
    const r=rows.filter(x=>vendorKey(x[m.vendorNo])===want);
    if(r.length||!m.contractor) return r;
  }
  if(m.contractor){
    const nm=String(s.name||"").trim().toLowerCase();
    return rows.filter(x=>String(x[m.contractor]||"").trim().toLowerCase()===nm);
  }
  return [];
}
function matchF(r,ds,skip){
  const m=S.map[ds], f=S.ui[ds].f;
  for(const k of dimsFor(ds)){
    if(k===skip) continue;
    const v=f[k];
    if(v&&keyNorm(r[m[k]])!==v) return false;
  }
  return true;
}
function filtered(ds){
  const u=S.ui[ds], m=S.map[ds];
  const qc=(u.qCode||"").trim().toLowerCase();
  const qv=(u.qVehicle||"").trim().toLowerCase();
  const qo=(u.qOther||"").trim().toLowerCase();
  const otherCols=S.meta[ds].metaCols.filter(c=>c!==m.personCode&&c!==m.vehicle);
  return scopedRows(ds).filter(r=>{
    if(!matchF(r,ds,null)) return false;
    if(qc&&!(m.personCode&&String(r[m.personCode]||"").toLowerCase().includes(qc))) return false;
    if(qv&&!(m.vehicle&&String(r[m.vehicle]||"").toLowerCase().includes(qv))) return false;
    if(qo&&!otherCols.some(c=>String(r[c]||"").toLowerCase().includes(qo))) return false;
    return true;
  });
}
function optionsFor(ds,key){
  const m=S.map[ds], map=new Map();
  scopedRows(ds).forEach(r=>{
    if(!matchF(r,ds,key)) return;
    const v=keyNorm(r[m[key]]); if(!v) return;
    map.set(v,(map.get(v)||0)+1);
  });
  let arr=Array.from(map.entries());
  if(key==="month") arr.sort((a,b)=>MONTHS.indexOf(a[0].slice(0,3))-MONTHS.indexOf(b[0].slice(0,3)));
  else if(key==="year") arr.sort((a,b)=>String(b[0]).localeCompare(String(a[0])));
  else arr.sort((a,b)=>a[0].localeCompare(b[0],"th",{numeric:true}));
  return arr;
}
function uniq(ds,rows,key){
  const m=S.map[ds]; if(!m[key]) return 0;
  const s=new Set(); rows.forEach(r=>{const v=keyNorm(r[m[key]]);if(v)s.add(v);});
  return s.size;
}
function dTotals(rows){
  let u=0,w=0,on=0,off=0;
  rows.forEach(r=>{u+=r.__u;w+=r.__w; if(r.__u>0)on++; else off++;});
  u=Math.round(u*100)/100; w=Math.round(w*100)/100;
  return {used:u,not:Math.round((w-u)*100)/100,work:w,rate:pct(u,w),onCnt:on,offCnt:off};
}
function dPerDay(ds,rows){
  const days=S.meta[ds].dayCols;
  const out=days.map(c=>({d:c,u:0,n:0}));
  rows.forEach(r=>days.forEach((c,i)=>{
    const d=dayVal(r[c]);
    if(d.kind==="blank"||d.kind==="other") return;
    out[i].u+=d.v; out[i].n+=1-d.v;
  }));
  return out;
}
function groupDaily(ds,rows,key){
  const m=S.map[ds], g=new Map();
  rows.forEach(r=>{
    const k=keyNorm(r[m[key]])||"(ไม่ระบุ)";
    if(!g.has(k)) g.set(k,{name:k,used:0,not:0});
    const o=g.get(k); o.used+=r.__u; o.not+=r.__n;
  });
  return Array.from(g.values()).map(o=>{
    const used=Math.round(o.used*100)/100, not=Math.round(o.not*100)/100;
    return {...o,used,not,work:Math.round((used+not)*100)/100,rate:pct(used,used+not)};
  });
}
const NOSHOW=/ยังไม่|ไม่มา|ไม่ได้มา|ขาด|pending/i;
function attended(ds,r){
  const m=S.map[ds];
  if(m.date){
    const v=String(r[m.date]||"").trim();
    if(v){ if(NOSHOW.test(v)) return false; if(parseDate(v)) return true; }
  }
  if(m.status){
    const s=String(r[m.status]||"").trim();
    if(s&&!NOSHOW.test(s)) return true;
  }
  return false;
}
function outcome(ds,r){
  if(!attended(ds,r)) return "none";
  const m=S.map[ds];
  const s=String(m.status?r[m.status]:"").trim();
  if(!s) return "wait";
  const l=s.toLowerCase();
  if(NEG.some(t=>l.includes(t))) return "fail";
  return isDone(s)?"pass":"wait";
}
function sTotals(ds,rows){
  let d=0; rows.forEach(r=>{if(attended(ds,r))d++;});
  return {total:rows.length,done:d,undone:rows.length-d,rate:pct(d,rows.length)};
}
function groupStatus(ds,rows,key){
  const m=S.map[ds], g=new Map();
  rows.forEach(r=>{
    const k=keyNorm(r[m[key]])||"(ไม่ระบุ)";
    if(!g.has(k)) g.set(k,{name:k,total:0,done:0});
    const o=g.get(k); o.total++; if(attended(ds,r)) o.done++;
  });
  return Array.from(g.values()).map(o=>({...o,undone:o.total-o.done,rate:pct(o.done,o.total)}));
}

function wWeight(l){
  const t=String(l);
  if(/ผู้รับเหมา|contractor/i.test(t)) return 3.4;
  if(/หมายเหตุ/.test(t)) return 2.4;
  if(/ชื่อ/.test(t)) return 2.6;
  if(/โรงงาน/.test(t)) return 2.0;
  if(/กิจการ/.test(t)) return 1.7;
  if(/สถานะรถ/.test(t)) return 1.5;
  if(/สถานะ/.test(t)) return 1.7;
  if(/เลขรถ/.test(t)) return 3.2;
  if(/เดือนที่ต้องอบรม/.test(t)) return 1.8;
  if(/วันที่|ผลการอบรม/.test(t)) return 1.7;
  if(/รหัส/.test(t)) return 1.4;
  if(/เข้างาน|คะแนน|เบอร์|ทะเบียน/.test(t)) return 1.25;
  return 1.05;
}
function colgroup(labels){
  const w=labels.map(wWeight), sum=w.reduce((a,b)=>a+b,0);
  return '<colgroup>'+w.map(x=>'<col style="width:'+(x/sum*100).toFixed(2)+'%">').join('')+'</colgroup>';
}
function kpi(cls,t,v,s){ return '<div class="kpi '+cls+'"><div class="t">'+esc(t)+'</div><div class="v">'+v+'</div><div class="s">'+esc(s)+'</div></div>'; }

    '<div><div class="cap">'+esc(M.rate)+'</div><div class="big">'+rate+'<i>%</i></div></div>'+
    '<div class="gauge-legend">'+legend+'</div></div></section>';
}
function paintGauge(rate){
  const host=$("#gTicks"); if(!host) return;
  const N=50, fill=Math.round(rate/100*N);
  let h="";
  for(let i=0;i<N;i++){
    const on=i<fill, major=(i+1)%5===0;
    const col=on?(rate<50?"var(--stop)":rate<80?"var(--amber)":"var(--go)"):"var(--line)";
    h+='<div class="tk'+(on?" f":"")+(on&&major?" f5":"")+'" style="background:'+col+'"></div>';
  }
  host.innerHTML=h;
  if(fill>0&&host.children[fill-1]) host.children[fill-1].classList.add("mk");
}
function donutHTML(a,b,la,lb,center,centerLbl){

    '<div class="mid"><b>'+center+'</b><span>'+esc(centerLbl)+'</span></div></div>'+

function barsPanel(ds,list,unitFn){

const BUCKETS=[
  {k:"never",label:"ไม่เคยใช้ SDA",      tone:"t-stop", cls:"k-stop",  badge:"stop", desc:"ไม่มีวันไหนที่ใช้ SDA เลย"},
  {k:"low",  label:"ใช้ SDA ต่ำกว่า 50%", tone:"t-amber",cls:"k-amber", badge:"mid",  desc:"ใช้บ้างแต่ไม่ถึงครึ่งของวันทำงาน"},
  {k:"mid",  label:"ใช้ SDA 50–<100%",   tone:"t-amber",cls:"k-amber", badge:"mid",  desc:"ใช้เกินครึ่งแต่ยังไม่ครบทุกวัน"},
  {k:"full", label:"ใช้ SDA 100%",       tone:"t-go",   cls:"k-go",    badge:"go",   desc:"ใช้ครบทุกวันทำงาน"}
];
function bucketOf(r){
  if(!r.__u) return "never";
  const p=pct(r.__u,r.__w);
  if(p>=100) return "full";
  if(p>=50)  return "mid";
  return "low";
}
function splitBuckets(rows){
  const o={never:[],low:[],mid:[],full:[]};
  rows.forEach(r=>o[bucketOf(r)].push(r));
  return o;
}
/* คอลัมน์ของตาราง SDA — ตัด ภาค / แผนก / Vendor และ %ไม่ใช้ ออก */
function sdaCols(ds){
  const m=S.map[ds], mt=S.meta[ds];
  const drop=new Set([m.region,m.dept,m.vendorNo,m.year].filter(Boolean));
  return mt.metaCols.filter(c=>!drop.has(c)&&!/^\s*%/.test(c));
}

/* --- Traning --- */
/* ค่าที่ถือว่า "ว่าง" แม้จะมีตัวอักษรอยู่ เช่น "-", "N/A", "ไม่ระบุ" */
const BLANKISH=/^(-+|–|—|_+|\.+|n\/?a|na|null|none|ว่าง|ไม่ระบุ|ไม่มีข้อมูล)$/i;
/* ข้อความที่ระบุชัดว่ารถคันนี้ยังไม่มี จบส. */
const NOPERSON=/ไม่มี\s*จบ\s*ส|ไม่มีคนขับ|ไม่มีพนักงานขับ|ยังไม่มี\s*จบ\s*ส/i;
function blankish(v){
  const s=String(v??"").trim();
  return !s||BLANKISH.test(s);
}
function hasCode(ds,r){
  const m=S.map[ds];
  const c=m.personCode?String(r[m.personCode]||"").trim():"";
  const n=m.personName?String(r[m.personName]||"").trim():"";
  /* ระบุไว้ตรง ๆ ในชีทว่าไม่มี จบส. */
  if(NOPERSON.test(c)||NOPERSON.test(n)) return false;
  /* ไม่มีทั้งรหัสและชื่อ (หรือเป็นค่าว่างอย่าง "-") */
  return !(blankish(c)&&blankish(n));
}
function trCols(ds,withResult,dropPerson,showDeadline){
  const m=S.map[ds];
  const base=[["biz","กิจการ"],["plant","โรงงาน"],["contractor","ผู้รับเหมา"],["vehicle","เบอร์รถ"],["personCode","รหัส จบส."],["personName","ชื่อ-นามสกุล"]];
  const extra=[["date","วันที่อบรม"],["status","ผลการอบรม"],["scorePre","คะแนนก่อนอบรม"],["scorePost","คะแนนหลังอบรม"]];
  let pick=withResult?base.concat(extra):base;
  if(dropPerson) pick=pick.filter(([k])=>k!=="personName"&&k!=="personCode");
  const out=pick.filter(([k])=>!!m[k]).map(([k,lbl])=>({key:k,col:m[k],label:lbl}));
  /* คอลัมน์เดือนที่ต้องอบรม — คำนวณจากช่องวันที่อบรม ไม่ได้อ่านตรงจากชีท */
  if(showDeadline&&m.date) out.push({key:"__deadline",col:null,label:"เดือนที่ต้องอบรม"});
  return out;
}
function sortRows(ds,rows){
  const m=S.map[ds];
  const order=["biz","plant","contractor","vehicle","personCode","personName","entry"].filter(k=>m[k]).map(k=>m[k]);
  return rows.slice().sort((a,b)=>{
    for(const c of order){
      const r=String(a[c]||"").localeCompare(String(b[c]||""),"th",{numeric:true});
      if(r) return r;
    }
    return 0;
  });
}
/* เรียงสำหรับตาราง "ยังไม่อบรม": เดือนที่ใกล้ถึงกำหนดขึ้นก่อน → ผู้รับเหมา → โรงงาน
   แถวที่อ่านเดือนไม่ได้ ("ไม่ระบุเดือน") ถูกดันไปท้ายสุดเสมอ เพราะจัดลำดับความเร่งด่วนไม่ได้ */
function sortByDeadline(ds,rows){
  const m=S.map[ds];
  const key=r=>{
    const info=deadlineInfo(ds,r);
    return info.key==="none" ? "9999-99" : info.key;
  };
  return rows.slice().sort((a,b)=>{
    const r0=key(a).localeCompare(key(b));
    if(r0) return r0;
    if(m.contractor){
      const r1=String(a[m.contractor]||"").localeCompare(String(b[m.contractor]||""),"th",{numeric:true});
      if(r1) return r1;
    }
    if(m.plant){
      const r2=String(a[m.plant]||"").localeCompare(String(b[m.plant]||""),"th",{numeric:true});
      if(r2) return r2;
    }
    if(m.personName){
      const r3=String(a[m.personName]||"").localeCompare(String(b[m.personName]||""),"th",{numeric:true});
      if(r3) return r3;
    }
    return 0;
  });
}
function trTable(ds,rows,title,tone,pageKey,withResult,dropPerson,badge,controls,showDeadline){
  const u=S.ui[ds], cols=trCols(ds,withResult,dropPerson,showDeadline);
  badge=badge||{text:"ยังไม่อบรม",cls:"stop"};
  if(u[pageKey]==null) u[pageKey]=1;
  const list=showDeadline?sortByDeadline(ds,rows):sortRows(ds,rows);
  const pages=Math.max(1,Math.ceil(list.length/PAGE));
  if(u[pageKey]>pages) u[pageKey]=pages;
  const st=(u[pageKey]-1)*PAGE, page=list.slice(st,st+PAGE);
  const head='<tr>'+cols.map(c=>'<th>'+esc(c.label)+'</th>').join("")+(withResult?'':'<th>สถานะ</th>')+'</tr>';
  const body=page.map(r=>'<tr>'+cols.map(c=>{
      if(c.key==="__deadline"){
        const info=deadlineInfo(ds,r);
        const cls=info.key==="none"?"":"mid";
        return '<td>'+(cls?'<span class="badge '+cls+'">'+esc(info.label)+'</span>':'<span class="note">'+esc(info.label)+'</span>')+'</td>';
      }
      const v=r[c.col]??"";
      if(c.key==="status"){
        const o=outcome(ds,r);
        const L={pass:["go","ผ่าน"],fail:["stop","ไม่ผ่าน"],wait:["mid","รอผล"],none:["stop","ยังไม่อบรม"]}[o];
        return '<td><span class="badge '+L[0]+'">'+esc(String(v).trim()||L[1])+'</span></td>';
      }
      return '<td>'+esc(v)+'</td>';
    }).join("")+(withResult?'':'<td><span class="badge '+badge.cls+'">'+esc(badge.text)+'</span></td>')+'</tr>').join("");
  return '<section class="panel"><div class="panel-head"><h3><span class="tone '+tone+'"></span>'+esc(title)+'</h3>'+
    '<div class="spacer">'+(controls||'')+'<span class="note">'+nf(list.length)+' รายการ</span></div></div>'+
    (page.length?'<div class="tablewrap fit"><table>'+colgroup(cols.map(c=>c.label).concat(withResult?[]:["สถานะ"]))+
      '<thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'
      :'<div class="empty"><b>ไม่มีรายการ</b>ไม่พบข้อมูลในกลุ่มนี้ตามตัวกรองที่เลือก</div>')+
    pager(st,page.length,list.length,u[pageKey],pages,pageKey)+'</section>';
}
/* อ่าน "เดือนที่ต้องอบรมภายใน" จากช่องวันที่อบรม
   รองรับรูปแบบ 8/2026, 08-2026, 2026-08 และวันที่เต็มรูปแบบ
   ถ้าอ่านไม่ได้ (เช่นเขียนแค่ "ยังไม่มาอบรม") จะจัดเข้ากลุ่ม "ไม่ระบุเดือน" */
function deadlineInfo(ds,r){
  const m=S.map[ds];
  const raw=m.date?String(r[m.date]||"").trim():"";
  if(raw){
    let mm=null,yy=null,g;
    if((g=raw.match(/(?:^|[^\d])(\d{1,2})\s*[\/\-.]\s*(\d{4})(?!\d)/))){ mm=+g[1]; yy=+g[2]; }
    else if((g=raw.match(/(?:^|[^\d])(\d{4})\s*[\/\-.]\s*(\d{1,2})(?!\d)/))){ yy=+g[1]; mm=+g[2]; }
    else { const d=parseDate(raw); if(d){ mm=d.getMonth()+1; yy=d.getFullYear(); } }
    if(mm&&yy){
      if(yy>2400) yy-=543;
      if(mm>=1&&mm<=12){
        const en=MONTHS[mm-1];
        return {key:yy+"-"+String(mm).padStart(2,"0"), label:(MONTH_TH[en]||en)+" "+yy};
      }
    }
  }
  return {key:"none",label:"ไม่ระบุเดือน"};
}
/* จบส.ใหม่ = ช่อง "เข้างานปี 2026" เป็น New, นอกนั้นถือเป็น จบส.เก่า */
function isNewStaff(ds,r){
  const m=S.map[ds];
  return String(m.entry?r[m.entry]||"":"").trim().toLowerCase()==="new";
}
/* ===================== GPS: ค่าใช้จ่าย ===================== */
/* รวมยอดตามยี่ห้อ GPS — เรียงจากยอดสูงสุดลงมา */
function groupCost(ds,rows,key){
  const m=S.map[ds], g=new Map();
  rows.forEach(r=>{
    const k=keyNorm(m[key]?r[m[key]]:"")||"(ไม่ระบุ)";
    if(!g.has(k)) g.set(k,{name:k,cost:0,count:0});
    const o=g.get(k); o.cost+=r.__cost; o.count++;
  });
  return Array.from(g.values()).sort((a,b)=>b.cost-a.cost);
}
function viewGPS(ds,rows,M){
  const m=S.map[ds], u=S.ui[ds];
  const total=rows.reduce((a,r)=>a+r.__cost,0);
  const brands=m.brand?groupCost(ds,rows,"brand"):[];
  const brandIndex={}; brands.forEach((b,i)=>brandIndex[b.name]=i);

  /* กล่องสรุป: ยอดรวมทั้งหมด แล้วตามด้วยยอดแยกรายยี่ห้อ */
  let k=kpi("k-all","ค่าใช้จ่ายทั้งหมด",baht(total)+" <span style='font-size:15px;color:var(--ink-dim)'>บาท</span>",
    nf(rows.length)+" รายการตามตัวกรอง");
  if(m.plant) k+=kpi("k-alt","โรงงาน",nf(uniq(ds,rows,"plant")),"โรงงานที่มีค่าใช้จ่าย");
  brands.forEach((b,i)=>{
    const cls=["k-all","k-go","k-alt","k-amber","k-stop"][i%5];
    k+=kpi(cls,b.name,baht(b.cost)+" <span style='font-size:15px;color:var(--ink-dim)'>บาท</span>",
      pct(b.cost,total)+"% · "+nf(b.count)+" รายการ");
  });
  if(!m.cost){
    k=kpi("k-stop","ไม่พบคอลัมน์ค่าใช้จ่าย","—","ตรวจหัวคอลัมน์ในชีท GPS")+k;
  }

  /* กราฟแท่ง: สัดส่วนค่าใช้จ่ายรายยี่ห้อ */
  const mxB=Math.max(1,...brands.map(b=>b.cost));
  const brandPanel=brands.length
    ? '<div class="panel"><div class="panel-head"><h3>ค่าใช้จ่ายแยกตามยี่ห้อ GPS</h3>'+
      '<span class="note">รวม '+baht(total)+' บาท</span></div><div class="bars">'+
      brands.map((b,i)=>'<div class="bar-row"><div class="nm" title="'+esc(b.name)+'">'+esc(b.name)+'</div>'+
        '<div class="bar-track" style="width:'+(b.cost/mxB*100).toFixed(1)+'%"><i style="width:100%;background:'+brandColor(i)+'"></i></div>'+
        '<div class="nums"><b>'+baht(b.cost)+'</b> · '+pct(b.cost,total)+'%</div></div>').join("")+
      '</div></div>'
    : '<div class="panel"><div class="empty"><b>ไม่พบคอลัมน์ยี่ห้อ GPS</b>ตรวจหัวคอลัมน์ในชีท GPS</div></div>';

  /* อันดับโรงงานที่ใช้จ่ายสูงสุด */
  let topPlant='';
  if(m.plant){
    const gp=groupCost(ds,rows,"plant").slice(0,8);
    const mxP=Math.max(1,...gp.map(o=>o.cost));
    topPlant='<div class="panel"><div class="panel-head"><h3>โรงงานที่ใช้จ่ายสูงสุด</h3><span class="note">8 อันดับแรก</span></div>'+
      (gp.length?'<div class="wl">'+gp.map(o=>'<div class="r"><div class="nm" title="'+esc(o.name)+'">'+esc(o.name)+'</div>'+
        '<div class="mini"><i style="width:'+(o.cost/mxP*100).toFixed(0)+'%;background:var(--steel)"></i></div>'+
        '<div class="n" style="color:var(--steel);min-width:78px">'+baht(o.cost)+'</div></div>').join("")+'</div>'
      :'<div class="empty">ไม่มีข้อมูล</div>')+'</div>';
  }

  return filtersHTML(ds)+emptyNote(rows.length)+'<section class="kpis">'+k+'</section>'+
    '<div class="cols">'+brandPanel+'<div class="stack">'+topPlant+'</div></div>'+
    gpsPlantTable(ds,rows,brands,brandIndex)+
    gpsVendorPanel(ds,rows,brands)+
    gpsDetailTable(ds,rows);
}
/* ตารางค่าใช้จ่ายรายโรงงาน — แยกคอลัมน์ตามยี่ห้อ GPS พร้อมแถวรวมท้ายตาราง */
function gpsPlantTable(ds,rows,brands,brandIndex){
  const m=S.map[ds], u=S.ui[ds];
  if(!m.plant) return '<section class="panel"><div class="empty"><b>ไม่พบคอลัมน์โรงงาน</b>ตรวจหัวคอลัมน์ในชีท GPS</div></section>';
  const bNames=brands.map(b=>b.name);
  /* สร้างตาราง: โรงงาน × ยี่ห้อ พร้อมเก็บเลขรถแบบไม่ซ้ำไว้ต่อโรงงาน */
  const g=new Map();
  rows.forEach(r=>{
    const p=keyNorm(r[m.plant])||"(ไม่ระบุ)";
    if(!g.has(p)) g.set(p,{name:p,total:0,count:0,by:{},veh:new Set()});
    const o=g.get(p);
    o.total+=r.__cost; o.count++;
    const b=keyNorm(m.brand?r[m.brand]:"")||"(ไม่ระบุ)";
    o.by[b]=(o.by[b]||0)+r.__cost;
    if(m.vehicle){ const v=keyNorm(r[m.vehicle]); if(v) o.veh.add(v); }
  });
  const list=Array.from(g.values()).sort((a,b)=>b.total-a.total);
  const pages=Math.max(1,Math.ceil(list.length/PAGE));
  if(u.pagePlant>pages) u.pagePlant=pages;
  const st=(u.pagePlant-1)*PAGE, page=list.slice(st,st+PAGE);
  const grand=list.reduce((a,o)=>a+o.total,0);
  const vehList=o=>Array.from(o.veh).sort((a,b)=>String(a).localeCompare(String(b),"th",{numeric:true}));
  /* จำนวนรถไม่ซ้ำรวมทุกโรงงาน — นับจากชุดผลลัพธ์ทั้งหมด ไม่ใช่ผลบวกของแต่ละโรงงาน
     (รถคันเดียวอาจปรากฏในหลายโรงงานได้ ถ้าย้ายโรงงานระหว่างเดือน) */
  const allVeh=new Set();
  if(m.vehicle) rows.forEach(r=>{ const v=keyNorm(r[m.vehicle]); if(v) allVeh.add(v); });

  const headers=["โรงงาน"].concat(bNames).concat(m.vehicle?["รวม","จำนวนรถ","เลขรถ"]:["รวม","จำนวนรายการ"]);
  const head='<tr>'+headers.map((h,i)=>{
    const style=i>0&&i<=bNames.length?' style="color:'+brandColor(i-1)+'"':'';
    return '<th'+style+'>'+esc(h)+'</th>';
  }).join("")+'</tr>';
  const body=page.map(o=>'<tr><td>'+esc(o.name)+'</td>'+
    bNames.map(b=>'<td>'+(o.by[b]?baht(o.by[b]):'<span style="opacity:.35">—</span>')+'</td>').join("")+
    '<td><b>'+baht(o.total)+'</b></td>'+
    (m.vehicle
      ? '<td>'+nf(o.veh.size)+'</td><td>'+esc(vehList(o).join(", "))+'</td>'
      : '<td>'+nf(o.count)+'</td>')+
    '</tr>').join("");
  /* แถวรวมทุกโรงงาน (รวมทั้งชุดผลลัพธ์ ไม่ใช่แค่หน้านี้) */
  const totalRow='<tr style="background:var(--panel-2);font-weight:700">'+
    '<td><b>รวมทุกโรงงาน ('+nf(list.length)+')</b></td>'+
    bNames.map(b=>{
      const sum=list.reduce((a,o)=>a+(o.by[b]||0),0);
      return '<td><b>'+baht(sum)+'</b></td>';
    }).join("")+
    '<td><b>'+baht(grand)+'</b></td>'+
    (m.vehicle
      ? '<td><b>'+nf(allVeh.size)+'</b></td><td><span style="opacity:.45">รถไม่ซ้ำทั้งหมด</span></td>'
      : '<td><b>'+nf(rows.length)+'</b></td>')+
    '</tr>';

  return '<section class="panel"><div class="panel-head"><h3><span class="tone" style="background:var(--steel)"></span>ค่าใช้จ่ายรายโรงงาน</h3>'+
    '<div class="spacer"><span class="note">'+nf(list.length)+' โรงงาน · รวม '+baht(grand)+' บาท</span></div></div>'+
    (page.length?'<div class="tablewrap fit"><table>'+colgroup(headers)+'<thead>'+head+'</thead><tbody>'+body+totalRow+'</tbody></table></div>'
      :'<div class="empty"><b>ไม่มีรายการ</b>ไม่พบข้อมูลตามตัวกรองที่เลือก</div>')+
    pager(st,page.length,list.length,u.pagePlant,pages,"pagePlant")+'</section>';
}
/* ตาราง+กราฟ ค่าใช้จ่ายราย Vendor — แต่ละรายมีแท่งเดียวซ้อนแยกสีตามยี่ห้อ GPS
   ทำให้เทียบได้ทั้ง "ใครจ่ายเยอะสุด" และ "แต่ละรายใช้ยี่ห้อไหนสัดส่วนเท่าไร" ในภาพเดียว */
function gpsVendorPanel(ds,rows,brands){
  const m=S.map[ds], u=S.ui[ds];
  const keyCol=m.contractor||m.vendorNo;
  if(!keyCol) return '<section class="panel"><div class="empty"><b>ไม่พบคอลัมน์ผู้รับเหมา</b>ตรวจหัวคอลัมน์ในชีท GPS</div></section>';
  const bNames=brands.map(b=>b.name);

  const g=new Map();
  rows.forEach(r=>{
    const k=keyNorm(r[keyCol])||"(ไม่ระบุ)";
    if(!g.has(k)) g.set(k,{name:k,no:"",total:0,by:{},veh:new Set()});
    const o=g.get(k);
    if(!o.no&&m.vendorNo&&m.contractor) o.no=keyNorm(r[m.vendorNo]);
    o.total+=r.__cost;
    const b=keyNorm(m.brand?r[m.brand]:"")||"(ไม่ระบุ)";
    o.by[b]=(o.by[b]||0)+r.__cost;
    if(m.vehicle){ const v=keyNorm(r[m.vehicle]); if(v) o.veh.add(v); }
  });
  const list=Array.from(g.values()).sort((a,b)=>b.total-a.total);
  const grand=list.reduce((a,o)=>a+o.total,0);
  const mx=Math.max(1,...list.map(o=>o.total));

  const legend='<div class="blegend">'+bNames.map((b,i)=>
    '<span><i style="background:'+brandColor(i)+'"></i>'+esc(b)+'</span>').join("")+'</div>';

  /* แสดงทุกรายในกล่องเดียว แล้วจำกัดความสูงให้เห็น 5 รายแรก ที่เหลือเลื่อนลงดู
     (ความสูงคำนวณจริงหลังเรนเดอร์ใน wire() เพราะแต่ละแถวสูงไม่เท่ากันตามจำนวนยี่ห้อ) */
  const body=list.map(o=>{
    /* ความยาวแท่งเทียบกับรายที่จ่ายสูงสุด แล้วภายในแท่งแบ่งสัดส่วนตามยี่ห้อ */
    const w=o.total/mx*100;
    const segs=bNames.filter(b=>o.by[b]).map(b=>{
      const idx=bNames.indexOf(b);
      const share=o.total?o.by[b]/o.total*100:0;
      return '<i style="width:'+share.toFixed(1)+'%;background:'+brandColor(idx)+'" title="'+esc(b)+' — '+baht(o.by[b])+' บาท ('+pct(o.by[b],o.total)+'%)"></i>';
    }).join("");
    const chips=bNames.filter(b=>o.by[b]).map(b=>{
      const idx=bNames.indexOf(b);
      return '<span class="vchip"><i style="background:'+brandColor(idx)+'"></i>'+esc(b)+' '+baht(o.by[b])+'</span>';
    }).join("");
    return '<div class="vrow">'+
      '<div class="vname"><b title="'+esc(o.name)+'">'+esc(o.name)+'</b>'+
        '<small>'+(o.no?esc(o.no)+' · ':'')+(m.vehicle?nf(o.veh.size)+' คัน · ':'')+pct(o.total,grand)+'% ของทั้งหมด</small>'+
        '<div class="vchips">'+chips+'</div></div>'+
      '<div class="vstack" style="width:'+w.toFixed(1)+'%">'+segs+'</div>'+
      '<div class="vtot">'+baht(o.total)+'</div>'+
    '</div>';
  }).join("");

  const more=list.length>5
    ? '<div class="vmore"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'+
      'เลื่อนลงในกรอบเพื่อดูอีก '+nf(list.length-5)+' ราย</div>'
    : '';

  return '<section class="panel"><div class="panel-head"><h3><span class="tone" style="background:var(--violet)"></span>ค่าใช้จ่ายราย Vendor แยกตามยี่ห้อ GPS</h3>'+
    '<div class="spacer"><span class="note">'+nf(list.length)+' ราย · รวม '+baht(grand)+' บาท</span></div></div>'+
    (list.length?legend+'<div class="vscroll" id="vscroll">'+body+'</div>'+more
      :'<div class="empty"><b>ไม่มีรายการ</b>ไม่พบข้อมูลตามตัวกรองที่เลือก</div>')+
    '</section>';
}
/* ===================== รถจดทะเบียน ===================== */
/* คอลัมน์ที่ใช้แบ่งกลุ่มสถานะ — ใช้ "สถานะรถ" ก่อน ถ้าไม่มีค่อยใช้คอลัมน์สถานะทั่วไป */
function regStatusCol(ds){ const m=S.map[ds]; return m.vstatus||m.status||""; }
/* นับจำนวนตามมิติ พร้อมนับรถไม่ซ้ำในแต่ละกลุ่ม */
function groupCount(ds,rows,key){
  const m=S.map[ds], g=new Map();
  rows.forEach(r=>{
    const k=keyNorm(m[key]?r[m[key]]:"")||"(ไม่ระบุ)";
    if(!g.has(k)) g.set(k,{name:k,count:0,veh:new Set()});
    const o=g.get(k); o.count++;
    if(m.vehicle){ const v=keyNorm(r[m.vehicle]); if(v) o.veh.add(v); }
  });
  return Array.from(g.values()).map(o=>({...o,vehCount:o.veh.size}))
    .sort((a,b)=>b.count-a.count);
}
function uniqVeh(ds,rows){
  const m=S.map[ds]; if(!m.vehicle) return rows.length;
  const s=new Set(); rows.forEach(r=>{const v=keyNorm(r[m.vehicle]); if(v)s.add(v);});
  return s.size;
}
function viewReg(ds,rows,M){
  const m=S.map[ds], u=S.ui[ds];
  const sCol=regStatusCol(ds);
  const stats=sCol?groupCount(ds,rows,m.vstatus?"vstatus":"status"):[];
  const sNames=stats.map(o=>o.name);

  /* กล่องสรุป */
  let k=kpi("k-all","รถทั้งหมด",nf(uniqVeh(ds,rows)),
    (m.vehicle?"เบอร์รถไม่ซ้ำ · ":"")+nf(rows.length)+" รายการ");
  if(m.contractor) k+=kpi("k-amber","ผู้รับเหมา",nf(uniq(ds,rows,"contractor")),"บริษัทในผลลัพธ์");
  if(m.plant) k+=kpi("k-alt","โรงงาน",nf(uniq(ds,rows,"plant")),"โรงงานที่มีรถ");
  stats.forEach((o,i)=>{
    const cls=["k-go","k-amber","k-stop","k-alt","k-all"][i%5];
    k+=kpi(cls,o.name,nf(m.vehicle?o.vehCount:o.count),
      pct(o.count,rows.length)+"% ของทั้งหมด"+(m.vehicle?" · "+nf(o.count)+" รายการ":""));
  });
  if(!sCol) k+=kpi("k-alt","สถานะรถ","—","ไม่พบคอลัมน์สถานะในชีท");

  /* กราฟแท่ง: จำนวนรถตามมิติที่เลือก */
  const dims=chartDims(ds);
  if(!dims.find(x=>x===u.dim)) u.dim=dims[0]||"";
  const g=u.dim?groupCount(ds,rows,u.dim).slice(0,12):[];
  const mx=Math.max(1,...g.map(o=>m.vehicle?o.vehCount:o.count));
  const seg='<div class="seg">'+dims.map(x=>'<button data-dim="'+x+'" class="'+(x===u.dim?"on":"")+'">'+esc(DIM_LABEL[x]||x)+'</button>').join("")+'</div>';
  const bars='<div class="panel"><div class="panel-head"><h3>จำนวนรถตามมิติ</h3><div class="spacer">'+seg+'</div></div>'+
    (g.length?'<div class="bars">'+g.map(o=>{
      const v=m.vehicle?o.vehCount:o.count;
      return '<div class="bar-row"><div class="nm" title="'+esc(o.name)+'">'+esc(o.name)+'</div>'+
        '<div class="bar-track" style="width:'+(v/mx*100).toFixed(1)+'%"><i style="width:100%;background:var(--go)"></i></div>'+
        '<div class="nums"><b>'+nf(v)+'</b> คัน · '+pct(o.count,rows.length)+'%</div></div>';
    }).join("")+'</div>':'<div class="empty">ไม่มีข้อมูลตามตัวกรอง</div>')+
    (g.length>=12?'<div class="note" style="margin-top:10px">แสดง 12 อันดับแรก</div>':'')+'</div>';

  /* สัดส่วนสถานะ */
  let donut='';
  if(stats.length){
    const tot=rows.length, mxS=Math.max(1,...stats.map(o=>o.count));
    donut='<div class="panel"><div class="panel-head"><h3>สัดส่วนสถานะรถ</h3></div><div class="bars">'+
      stats.map((o,i)=>{
        const col=["var(--go)","var(--amber)","var(--stop)","var(--violet)","var(--steel)"][i%5];
        return '<div class="bar-row"><div class="nm" title="'+esc(o.name)+'">'+esc(o.name)+'</div>'+
          '<div class="bar-track" style="width:'+(o.count/mxS*100).toFixed(1)+'%"><i style="width:100%;background:'+col+'"></i></div>'+
          '<div class="nums"><b>'+nf(o.count)+'</b> · '+pct(o.count,tot)+'%</div></div>';
      }).join("")+'</div></div>';
  }

  return filtersHTML(ds)+emptyNote(rows.length)+'<section class="kpis">'+k+'</section>'+
    '<div class="cols">'+bars+'<div class="stack">'+donut+'</div></div>'+
    regPlantTable(ds,rows,sNames)+
    gpsDetailTable(ds,rows);
}
/* ตารางรถรายโรงงาน — แยกคอลัมน์ตามสถานะรถ พร้อมแถวรวม */
function regPlantTable(ds,rows,sNames){
  const m=S.map[ds], u=S.ui[ds];
  if(!m.plant) return '<section class="panel"><div class="empty"><b>ไม่พบคอลัมน์โรงงาน</b>ตรวจหัวคอลัมน์ในชีท registration</div></section>';
  const sCol=regStatusCol(ds);
  const g=new Map();
  rows.forEach(r=>{
    const p=keyNorm(r[m.plant])||"(ไม่ระบุ)";
    if(!g.has(p)) g.set(p,{name:p,count:0,by:{},veh:new Set()});
    const o=g.get(p); o.count++;
    if(sCol){ const st=keyNorm(r[sCol])||"(ไม่ระบุ)"; o.by[st]=(o.by[st]||0)+1; }
    if(m.vehicle){ const v=keyNorm(r[m.vehicle]); if(v) o.veh.add(v); }
  });
  const list=Array.from(g.values()).sort((a,b)=>b.count-a.count);
  const pages=Math.max(1,Math.ceil(list.length/PAGE));
  if(u.pagePlant>pages) u.pagePlant=pages;
  const st0=(u.pagePlant-1)*PAGE, page=list.slice(st0,st0+PAGE);
  const allVeh=new Set();
  if(m.vehicle) rows.forEach(r=>{const v=keyNorm(r[m.vehicle]); if(v) allVeh.add(v);});

  const headers=["โรงงาน"].concat(sNames).concat(m.vehicle?["รวม","จำนวนรถ"]:["รวม"]);
  const head='<tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr>';
  const body=page.map(o=>'<tr><td>'+esc(o.name)+'</td>'+
    sNames.map(n=>'<td>'+(o.by[n]?nf(o.by[n]):'<span style="opacity:.35">—</span>')+'</td>').join("")+
    '<td><b>'+nf(o.count)+'</b></td>'+(m.vehicle?'<td>'+nf(o.veh.size)+'</td>':'')+'</tr>').join("");
  const totalRow='<tr style="background:var(--panel-2);font-weight:700">'+
    '<td><b>รวมทุกโรงงาน ('+nf(list.length)+')</b></td>'+
    sNames.map(n=>'<td><b>'+nf(list.reduce((a,o)=>a+(o.by[n]||0),0))+'</b></td>').join("")+
    '<td><b>'+nf(rows.length)+'</b></td>'+(m.vehicle?'<td><b>'+nf(allVeh.size)+'</b></td>':'')+'</tr>';

  return '<section class="panel"><div class="panel-head"><h3><span class="tone t-go"></span>รถจดทะเบียนรายโรงงาน</h3>'+
    '<div class="spacer"><span class="note">'+nf(list.length)+' โรงงาน · '+nf(rows.length)+' รายการ</span></div></div>'+
    (page.length?'<div class="tablewrap fit"><table>'+colgroup(headers)+'<thead>'+head+'</thead><tbody>'+body+totalRow+'</tbody></table></div>'
      :'<div class="empty"><b>ไม่มีรายการ</b>ไม่พบข้อมูลตามตัวกรองที่เลือก</div>')+
    pager(st0,page.length,list.length,u.pagePlant,pages,"pagePlant")+'</section>';
}
/* ตารางรายละเอียดรายรายการ — แสดงคอลัมน์ทั้งหมดจากชีท GPS */
function gpsDetailTable(ds,rows){
  const u=S.ui[ds], cols=S.meta[ds].metaCols;
  let list=rows.slice();
  if(u.sort){
    const c=u.sort;
    list.sort((a,b)=>{
      const x=String(a[c]??""),y=String(b[c]??"");
      const nx=parseFloat(x.replace(/[,%]/g,"")),ny=parseFloat(y.replace(/[,%]/g,""));
      if(!isNaN(nx)&&!isNaN(ny)) return (nx-ny)*u.dir;
      return x.localeCompare(y,"th",{numeric:true})*u.dir;
    });
  }
  const pages=Math.max(1,Math.ceil(list.length/PAGE));
  if(u.page>pages) u.page=pages;
  const st=(u.page-1)*PAGE, page=list.slice(st,st+PAGE);
  const head='<tr>'+cols.map(c=>'<th data-sort="'+esc(c)+'">'+esc(c)+(u.sort===c?'<span class="ar">'+(u.dir>0?"↑":"↓")+'</span>':'')+'</th>').join("")+'</tr>';
  const body=page.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c]??"")+'</td>').join("")+'</tr>').join("");
  return '<section class="panel"><div class="panel-head"><h3>รายละเอียดรายรายการ</h3>'+
    '<div class="spacer"><span class="note">'+nf(list.length)+' รายการ</span></div></div>'+
    (page.length?'<div class="tablewrap fit"><table>'+colgroup(cols)+'<thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'
      :'<div class="empty"><b>ไม่พบข้อมูล</b>ลองล้างตัวกรองหรือแก้คำค้น</div>')+
    pager(st,page.length,list.length,u.page,pages,"page")+'</section>';
}
function viewTraining(ds,rows,M){
  const m=S.map[ds], u=S.ui[ds];
  const withCode=rows.filter(r=>hasCode(ds,r));
  const noCode=rows.filter(r=>!hasCode(ds,r));
  const T=sTotals(ds,withCode);
  let pass=0,fail=0,wait=0;
  withCode.forEach(r=>{const o=outcome(ds,r);if(o==="pass")pass++;else if(o==="fail")fail++;else if(o==="wait")wait++;});
  const legend='<span><i style="background:var(--go)"></i>'+M.go+' '+nf(T.done)+'</span>'+
               '<span><i style="background:var(--stop)"></i>'+M.no+' '+nf(T.undone)+'</span>'+
               '<span><i style="background:var(--ink)"></i>เป้าหมาย 100%</span>';
  let k=kpi("k-all","ทั้งหมด",nf(T.total),"จบส.ที่มีข้อมูล ตามตัวกรอง");
  if(m.personCode||m.personName) k+=kpi("k-alt","จบส. (คน)",nf(uniq(ds,withCode,"personCode")||uniq(ds,withCode,"personName")),"ไม่ซ้ำ");
  k+=kpi("k-stop",M.no,nf(T.undone),(100-T.rate).toFixed(1).replace(/\.0$/,"")+"% ของทั้งหมด");
  k+=kpi("k-go",M.go,nf(T.done),T.rate+"% ของทั้งหมด");
  if(m.status){
    k+=kpi("k-go","ผ่าน",nf(pass),T.done?pct(pass,T.done)+"% ของผู้ที่อบรมแล้ว":"—");
    k+=kpi("k-stop","ไม่ผ่าน",nf(fail),T.done?pct(fail,T.done)+"% ของผู้ที่อบรมแล้ว":"—");
    if(wait) k+=kpi("k-amber","รอผล",nf(wait),"อบรมแล้วแต่ยังไม่บันทึกผล");
  }
  if(m.contractor) k+=kpi("k-amber","ผู้รับเหมา",nf(uniq(ds,rows,"contractor")),"บริษัทในผลลัพธ์");
  {
    k+=kpi("k-amber","รถไม่มี จบส.",nf(noCode.length),"ยังไม่ได้กำหนดผู้ขับ");
  }
  if(m.date){
    const now=new Date(); let old=0,recent=0;
    withCode.forEach(r=>{const d=parseDate(r[m.date]); if(!d)return; const dd=(now-d)/86400000;
      if(dd>365)old++; if(dd>=0&&dd<=30)recent++;});
    k+=kpi("k-amber","อบรมเกิน 1 ปี",nf(old),"ควรทบทวน/อบรมซ้ำ");
    k+=kpi("k-alt","อบรมใน 30 วัน",nf(recent),"ความเคลื่อนไหวล่าสุด");
  }
  const g=groupStatus(ds,withCode,u.dim||"contractor").sort((a,b)=>b.total-a.total).slice(0,12)
    .map(o=>({name:o.name,tot:o.total,good:o.done,rate:o.rate,done:o.done}));
  const bars=barsPanel(ds,g,o=>'<b>'+nf(o.done)+'</b>/'+nf(o.tot)+' · '+o.rate+'%');
  const donut='<div class="panel"><div class="panel-head"><h3>อบรมแล้ว / ยังไม่อบรม</h3></div>'+
    donutHTML(T.done,T.undone,M.go,M.no,nf(T.total),"รายการ")+'</div>';
  let res='';
  if(m.status&&T.done){
    const mx=Math.max(pass,fail,wait,1);
    const row=(lbl,v,col)=>'<div class="bar-row"><div class="nm">'+lbl+'</div>'+
      '<div class="bar-track" style="width:'+(v/mx*100).toFixed(1)+'%"><i style="width:100%;background:'+col+'"></i></div>'+
      '<div class="nums"><b>'+nf(v)+'</b> · '+pct(v,T.done)+'%</div></div>';
    res='<div class="panel"><div class="panel-head"><h3>ผลการอบรม</h3><span class="note">เฉพาะผู้ที่อบรมแล้ว</span></div>'+
      '<div class="bars">'+row("ผ่าน",pass,"var(--go)")+row("ไม่ผ่าน",fail,"var(--stop)")+
      (wait?row("รอบันทึกผล",wait,"var(--amber)"):"")+'</div></div>';
  }
  let wl='';
  if(m.contractor){
    const gc=groupStatus(ds,withCode,"contractor").filter(o=>o.undone>0).sort((a,b)=>b.undone-a.undone).slice(0,8);
    const mx=Math.max(1,...gc.map(o=>o.undone));
    wl='<div class="panel"><div class="panel-head"><h3>ต้องตามงาน · ยังไม่อบรมสูงสุด</h3></div>'+
      (gc.length?'<div class="wl">'+gc.map(o=>'<div class="r"><div class="nm" title="'+esc(o.name)+'">'+esc(o.name)+'</div>'+
        '<div class="mini"><i style="width:'+(o.undone/mx*100).toFixed(0)+'%"></i></div><div class="n">'+nf(o.undone)+'</div></div>').join("")+'</div>'
      :'<div class="empty"><b>ครบทุกราย</b>ไม่มีรายการค้าง</div>')+'</div>';
  }
  const notYet=withCode.filter(r=>outcome(ds,r)==="none");
  const failed=withCode.filter(r=>outcome(ds,r)==="fail");
  const okDone=withCode.filter(r=>{const o=outcome(ds,r);return o==="pass"||o==="wait";});

  /* ยังไม่อบรม แยก จบส.เก่า / จบส.ใหม่ */
  const notYetNew=notYet.filter(r=>isNewStaff(ds,r));
  const notYetOld=notYet.filter(r=>!isNewStaff(ds,r));

  /* จบส.เก่า มีแท็บย่อยรายเดือนตามกำหนดอบรม */
  const bucket=new Map();
  notYetOld.forEach(r=>{
    const info=deadlineInfo(ds,r);
    if(!bucket.has(info.key)) bucket.set(info.key,{label:info.label,rows:[]});
    bucket.get(info.key).rows.push(r);
  });
  const monthKeys=Array.from(bucket.keys()).sort((a,b)=>{
    if(a==="none") return 1; if(b==="none") return -1;
    return a.localeCompare(b);
  });
  if(u.oldMonth&&!bucket.has(u.oldMonth)) u.oldMonth="";
  const oldShown=u.oldMonth?bucket.get(u.oldMonth).rows:notYetOld;
  const monthSeg=monthKeys.length>1
    ? '<div class="seg"><button data-omonth="" class="'+(!u.oldMonth?"on":"")+'">ทุกเดือน · '+nf(notYetOld.length)+'</button>'+
      monthKeys.map(kk=>'<button data-omonth="'+esc(kk)+'" class="'+(u.oldMonth===kk?"on":"")+'">'+
        esc(bucket.get(kk).label)+' · '+nf(bucket.get(kk).rows.length)+'</button>').join("")+'</div>'
    : '';

  return filtersHTML(ds)+emptyNote(rows.length)+'<section class="kpis">'+k+'</section>'+
    gaugeHTML(T.rate,M,legend)+
    '<div class="cols">'+bars+'<div class="stack">'+donut+res+wl+'</div></div>'+
    trTable(ds,oldShown,"ยังไม่อบรม · จบส.เก่า","t-stop","pageA",false,false,null,monthSeg,true)+
    trTable(ds,notYetNew,"ยังไม่อบรม · จบส.ใหม่","t-stop","pageE",false,false,null,null,true)+
    trTable(ds,failed,"อบรมแล้ว แต่ไม่ผ่าน","t-amber","pageC",true)+
    trTable(ds,okDone,"อบรมแล้ว","t-go","pageB",true)+
    trTable(ds,noCode,"รถไม่มี จบส.","t-amber","pageD",false,true,{text:"ไม่มี จบส.",cls:"mid"});
}
