function resetPages(u){ Object.keys(u).forEach(k=>{ if(k.indexOf("page")===0) u[k]=1; }); }
function bindSearchInput(id,ds,key){
  const el=$("#"+id); if(!el) return;
  const u=S.ui[ds];
  let t;
  el.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{ u[key]=el.value; resetPages(u); render();
    const n=$("#"+id); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },280); };
}
function wire(ds){
  const u=S.ui[ds];
  $$('#content select[data-f]').forEach(s=>s.onchange=()=>{u.f[s.dataset.f]=s.value;resetPages(u);render();});
  bindSearchInput("fQCode",ds,"qCode");
  bindSearchInput("fQVehicle",ds,"qVehicle");
  bindSearchInput("fQOther",ds,"qOther");
  const c=$("#fClear"); if(c) c.onclick=()=>{u.f={};u.qCode="";u.qVehicle="";u.qOther="";resetPages(u);render();};
  const x=$("#fCsv");   if(x) x.onclick=()=>doExport(ds);
  const p=$("#fPrint"); if(p) p.onclick=()=>window.print();
  $$('#content [data-dim]').forEach(b=>b.onclick=()=>{u.dim=b.dataset.dim;render();});
  $$('#content [data-omonth]').forEach(b=>b.onclick=()=>{u.oldMonth=b.dataset.omonth;u.pageA=1;render();});
  $$('#content th[data-sort]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort;
    if(u.sort===k) u.dir=-u.dir; else {u.sort=k;u.dir=1;}
    render();
  });
  $$('#content [data-pg]').forEach(b=>b.onclick=()=>{u[b.dataset.key]+=Number(b.dataset.pg);render();});
  const on=$("#dayOn"), off=$("#dayOff");
  if(on) on.onclick=()=>{u.days=true;render();};
  if(off) off.onclick=()=>{u.days=false;render();};
  fitVendorScroll();
}
/* จำกัดความสูงกล่อง Vendor ให้เห็นพอดี 5 รายการ ที่เหลือเลื่อนดู
   ต้องวัดหลังเรนเดอร์จริง เพราะแต่ละแถวสูงไม่เท่ากัน (ชิปยี่ห้ออาจตกบรรทัด)
   ถ้าวัดไม่ได้ จะคงค่าสำรองจาก CSS (480px) ไว้แทน ไม่ปล่อยให้กรอบยืดเต็ม */
function fitVendorScroll(){
  const box=$("#vscroll"); if(!box) return;
  const rows=box.children;
  if(rows.length<=5){ box.style.maxHeight="none"; return; }
  let tries=0;
  const measure=()=>{
    const h=rows[5].offsetTop-rows[0].offsetTop;
    if(h>40){ box.style.maxHeight=h+"px"; return; }
    /* เลย์เอาต์ยังไม่นิ่ง (ฟอนต์ยังโหลดไม่เสร็จ) — ลองใหม่อีกไม่กี่รอบ */
    if(++tries<5) requestAnimationFrame(measure);
  };
  requestAnimationFrame(measure);
}
/* ปรับความสูงใหม่เมื่อขนาดหน้าจอเปลี่ยน เพราะชิปยี่ห้ออาจตกบรรทัดไม่เท่าเดิม */
let _vfitTimer=null;
window.addEventListener("resize",()=>{
  clearTimeout(_vfitTimer);
  _vfitTimer=setTimeout(fitVendorScroll,180);
});
/* ===================== ดาวน์โหลดเป็น Excel (ตีตาราง + ใส่สีเหมือนฐานข้อมูล) ===================== */
let _xlsxLoading=null;
function ensureExcelLib(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(_xlsxLoading) return _xlsxLoading;
  _xlsxLoading=new Promise((res,rej)=>{
    const el=document.createElement("script");
    el.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    el.onload=()=>window.ExcelJS?res(window.ExcelJS):rej(new Error("โหลดไลบรารี Excel ไม่สำเร็จ"));
    el.onerror=()=>rej(new Error("โหลดไลบรารี Excel ไม่สำเร็จ — ตรวจการเชื่อมต่ออินเทอร์เน็ต"));
    document.head.appendChild(el);
  });
  return _xlsxLoading;
}
const XLTHIN={style:"thin",color:{argb:"FFB0B0B0"}};
const XLBORDER={top:XLTHIN,left:XLTHIN,bottom:XLTHIN,right:XLTHIN};
const XLFILL={
  head:{type:"pattern",pattern:"solid",fgColor:{argb:"FFE3E8EF"}},
  go  :{type:"pattern",pattern:"solid",fgColor:{argb:"FFC6EFCE"}},
  stop:{type:"pattern",pattern:"solid",fgColor:{argb:"FFFFC7CE"}},
  mid :{type:"pattern",pattern:"solid",fgColor:{argb:"FFFFEB9C"}}
};
const XLFONT={
  head:{bold:true,color:{argb:"FF1F2937"}},
  go  :{color:{argb:"FF006100"}},
  stop:{color:{argb:"FF9C0006"}},
  mid :{color:{argb:"FF9C6500"}}
};
function xlHeaderRow(row){
  row.eachCell(c=>{ c.fill=XLFILL.head; c.font=XLFONT.head; c.border=XLBORDER;
    c.alignment={vertical:"middle",horizontal:"center",wrapText:true}; });
  row.height=24;
}
function xlCell(cell,fillKey){
  cell.border=XLBORDER;
  cell.alignment={vertical:"middle",wrapText:false};
  if(fillKey){ cell.fill=XLFILL[fillKey]; cell.font=XLFONT[fillKey]; }
}
function xlFitColumns(ws,colCount){
  const w=new Array(colCount).fill(9);
  ws.eachRow(row=>{
    row.eachCell((cell,idx)=>{
      const len=String(cell.value??"").length;
      if(len+3>w[idx-1]) w[idx-1]=Math.min(42,len+3);
    });
  });
  w.forEach((width,i)=>{ ws.getColumn(i+1).width=width; });
}
function downloadBuf(buf,filename){
  const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  URL.revokeObjectURL(a.href);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function rateFillKey(u,w){ if(!u) return "stop"; return pct(u,w)>=100?"go":"mid"; }

async function exportExcelSDA(ds){
  const ExcelJS=await ensureExcelLib();
  const mt=S.meta[ds], rows=filtered(ds);
  const cols=sdaCols(ds), dayCols=mt.dayCols;
  const headers=cols.concat(dayCols).concat(["ใช้ SDA (วัน)","ไม่ใช้ SDA (วัน)","%ใช้ SDA"]);
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("SDA");
  xlHeaderRow(ws.addRow(headers));
  rows.forEach(r=>{
    const vals=cols.map(c=>r[c]??"").concat(dayCols.map(d=>r[d]??"")).concat([r.__u,r.__n,pct(r.__u,r.__w)+"%"]);
    const row=ws.addRow(vals);
    row.eachCell((cell,idx)=>{
      if(idx>cols.length&&idx<=cols.length+dayCols.length){
        const v=String(cell.value||"").trim().toUpperCase();
        xlCell(cell, v==="M"?"go":v==="W"?"stop":null);
      }else if(idx===headers.length){
        xlCell(cell, rateFillKey(r.__u,r.__w));
      }else{
        xlCell(cell, null);
      }
    });
  });
  xlFitColumns(ws,headers.length);
  ws.views=[{state:"frozen",ySplit:1}];
  downloadBuf(await wb.xlsx.writeBuffer(),"SDA_"+todayStr()+".xlsx");
}

async function exportExcelTraining(ds){
  const ExcelJS=await ensureExcelLib();
  const rows=filtered(ds);
  const withCode=rows.filter(r=>hasCode(ds,r));
  const noCode=rows.filter(r=>!hasCode(ds,r));
  const notYet=withCode.filter(r=>outcome(ds,r)==="none");
  const groups=[
    {name:"ยังไม่อบรม-จบส.เก่า", rows:notYet.filter(r=>!isNewStaff(ds,r)), withResult:false, badge:{text:"ยังไม่อบรม",cls:"stop"}, deadline:true},
    {name:"ยังไม่อบรม-จบส.ใหม่", rows:notYet.filter(r=>isNewStaff(ds,r)), withResult:false, badge:{text:"ยังไม่อบรม",cls:"stop"}, deadline:true},
    {name:"อบรมแล้ว แต่ไม่ผ่าน", rows:withCode.filter(r=>outcome(ds,r)==="fail"), withResult:true},
    {name:"อบรมแล้ว", rows:withCode.filter(r=>{const o=outcome(ds,r);return o==="pass"||o==="wait";}), withResult:true},
    {name:"รถไม่มี จบส.", rows:noCode, withResult:false, dropPerson:true, badge:{text:"ไม่มี จบส.",cls:"mid"}}
  ];
  const wb=new ExcelJS.Workbook();
  groups.forEach(g=>{
    if(!g.rows.length) return;
    const cols=trCols(ds,g.withResult,g.dropPerson);
    const headers=cols.map(c=>c.label).concat(g.withResult?[]:["สถานะ"]).concat(g.deadline?["เดือนที่ต้องอบรม"]:[]);
    const ws=wb.addWorksheet(g.name.slice(0,31));
    xlHeaderRow(ws.addRow(headers));
    const list=g.deadline?sortByDeadline(ds,g.rows):sortRows(ds,g.rows);
    list.forEach(r=>{
      const vals=cols.map(c=>r[c.col]??"")
        .concat(g.withResult?[]:[g.badge.text])
        .concat(g.deadline?[deadlineInfo(ds,r).label]:[]);
      const row=ws.addRow(vals);
      row.eachCell((cell,idx)=>{
        const c=cols[idx-1];
        if(c&&c.key==="status"){
          const map={pass:"go",fail:"stop",wait:"mid",none:"stop"};
          xlCell(cell, map[outcome(ds,r)]);
        }else if(!g.withResult&&idx===cols.length+1){
          xlCell(cell, g.badge.cls);
        }else{
          xlCell(cell, null);
        }
      });
    });
    xlFitColumns(ws,headers.length);
    ws.views=[{state:"frozen",ySplit:1}];
  });
  if(!wb.worksheets.length) wb.addWorksheet("ไม่มีข้อมูล");
  downloadBuf(await wb.xlsx.writeBuffer(),"Traning_"+todayStr()+".xlsx");
}

async function exportExcelGPS(ds){
  const ExcelJS=await ensureExcelLib();
  const m=S.map[ds], rows=filtered(ds);
  const brands=m.brand?groupCost(ds,rows,"brand"):[];
  const bNames=brands.map(b=>b.name);
  const wb=new ExcelJS.Workbook();

  /* ชีทที่ 1: สรุปรายโรงงาน แยกคอลัมน์ตามยี่ห้อ */
  if(m.plant){
    const g=new Map();
    rows.forEach(r=>{
      const p=keyNorm(r[m.plant])||"(ไม่ระบุ)";
      if(!g.has(p)) g.set(p,{name:p,total:0,count:0,by:{},veh:new Set()});
      const o=g.get(p); o.total+=r.__cost; o.count++;
      const b=keyNorm(m.brand?r[m.brand]:"")||"(ไม่ระบุ)";
      o.by[b]=(o.by[b]||0)+r.__cost;
      if(m.vehicle){ const v=keyNorm(r[m.vehicle]); if(v) o.veh.add(v); }
    });
    const list=Array.from(g.values()).sort((a,b)=>b.total-a.total);
    const allVeh=new Set();
    if(m.vehicle) rows.forEach(r=>{ const v=keyNorm(r[m.vehicle]); if(v) allVeh.add(v); });
    const ws=wb.addWorksheet("สรุปรายโรงงาน");
    const tailCols=m.vehicle?["รวม","จำนวนรถ","เลขรถ"]:["รวม","จำนวนรายการ"];
    const headers=["โรงงาน"].concat(bNames).concat(tailCols);
    xlHeaderRow(ws.addRow(headers));
    const numCols=1+bNames.length+1;   /* คอลัมน์ที่เป็นตัวเงิน (ยี่ห้อ + รวม) */
    list.forEach(o=>{
      const tail=m.vehicle
        ? [o.total,o.veh.size,Array.from(o.veh).sort((a,b)=>String(a).localeCompare(String(b),"th",{numeric:true})).join(", ")]
        : [o.total,o.count];
      const row=ws.addRow([o.name].concat(bNames.map(b=>o.by[b]||0)).concat(tail));
      row.eachCell((cell,idx)=>{ xlCell(cell,null); if(idx>1&&idx<=numCols) cell.numFmt='#,##0.00'; });
    });
    const tTail=m.vehicle
      ? [list.reduce((a,o)=>a+o.total,0),allVeh.size,""]
      : [list.reduce((a,o)=>a+o.total,0),rows.length];
    const totalRow=ws.addRow(["รวมทุกโรงงาน"]
      .concat(bNames.map(b=>list.reduce((a,o)=>a+(o.by[b]||0),0)))
      .concat(tTail));
    totalRow.eachCell((cell,idx)=>{ xlCell(cell,"mid"); cell.font={bold:true}; if(idx>1&&idx<=numCols) cell.numFmt='#,##0.00'; });
    xlFitColumns(ws,headers.length);
    ws.views=[{state:"frozen",ySplit:1}];
  }

  /* ชีทที่ 2: สรุปรายยี่ห้อ */
  if(bNames.length){
    const ws2=wb.addWorksheet("สรุปรายยี่ห้อ");
    xlHeaderRow(ws2.addRow(["ยี่ห้อ GPS","ค่าใช้จ่ายรวม","สัดส่วน %","จำนวนรายการ"]));
    const tot=brands.reduce((a,b)=>a+b.cost,0);
    brands.forEach(b=>{
      const row=ws2.addRow([b.name,b.cost,pct(b.cost,tot),b.count]);
      row.eachCell((cell,idx)=>{ xlCell(cell,null); if(idx===2) cell.numFmt='#,##0.00'; });
    });
    xlFitColumns(ws2,4);
    ws2.views=[{state:"frozen",ySplit:1}];
  }

  /* ชีทที่ 3: สรุปราย Vendor แยกคอลัมน์ตามยี่ห้อ */
  const keyCol=m.contractor||m.vendorNo;
  if(keyCol){
    const g=new Map();
    rows.forEach(r=>{
      const k=keyNorm(r[keyCol])||"(ไม่ระบุ)";
      if(!g.has(k)) g.set(k,{name:k,no:"",total:0,by:{},veh:new Set()});
      const o=g.get(k);
      if(!o.no&&m.vendorNo&&m.contractor) o.no=keyNorm(r[m.vendorNo]);
      o.total+=r.__cost;
      const b=keyNorm(m.brand?r[m.brand]:"")||"(ไม่ระบุ)";
      o.by[b]=(o.by[b]||0)+r.__cost;
      if(m.vehicle){ const v=keyNorm(r[m.vehicle]); if(v) o.veh.add(v); }
    });
    const list=Array.from(g.values()).sort((a,b)=>b.total-a.total);
    const ws=wb.addWorksheet("สรุปราย Vendor");
    const lead=(m.vendorNo&&m.contractor)?["ผู้รับเหมา","เลข Vendor"]:["ผู้รับเหมา"];
    const tail=m.vehicle?["รวม","จำนวนรถ"]:["รวม"];
    const headers=lead.concat(bNames).concat(tail);
    xlHeaderRow(ws.addRow(headers));
    const firstNum=lead.length+1, lastNum=lead.length+bNames.length+1;
    list.forEach(o=>{
      const front=(m.vendorNo&&m.contractor)?[o.name,o.no]:[o.name];
      const back=m.vehicle?[o.total,o.veh.size]:[o.total];
      const row=ws.addRow(front.concat(bNames.map(b=>o.by[b]||0)).concat(back));
      row.eachCell((cell,idx)=>{ xlCell(cell,null); if(idx>=firstNum&&idx<=lastNum) cell.numFmt='#,##0.00'; });
    });
    const allVeh=new Set();
    if(m.vehicle) rows.forEach(r=>{ const v=keyNorm(r[m.vehicle]); if(v) allVeh.add(v); });
    const tFront=(m.vendorNo&&m.contractor)?["รวมทุกราย",""]:["รวมทุกราย"];
    const tBack=m.vehicle?[list.reduce((a,o)=>a+o.total,0),allVeh.size]:[list.reduce((a,o)=>a+o.total,0)];
    const totalRow=ws.addRow(tFront
      .concat(bNames.map(b=>list.reduce((a,o)=>a+(o.by[b]||0),0)))
      .concat(tBack));
    totalRow.eachCell((cell,idx)=>{ xlCell(cell,"mid"); cell.font={bold:true}; if(idx>=firstNum&&idx<=lastNum) cell.numFmt='#,##0.00'; });
    xlFitColumns(ws,headers.length);
    ws.views=[{state:"frozen",ySplit:1}];
  }

  /* ชีทสุดท้าย: ข้อมูลดิบทุกคอลัมน์ */
  const cols=S.meta[ds].metaCols;
  const ws3=wb.addWorksheet("รายละเอียด");
  xlHeaderRow(ws3.addRow(cols));
  rows.forEach(r=>{
    const row=ws3.addRow(cols.map(c=>r[c]??""));
    row.eachCell(cell=>xlCell(cell,null));
  });
  xlFitColumns(ws3,cols.length);
  ws3.views=[{state:"frozen",ySplit:1}];

  if(!wb.worksheets.length) wb.addWorksheet("ไม่มีข้อมูล");
  downloadBuf(await wb.xlsx.writeBuffer(),"GPS_"+todayStr()+".xlsx");
}

async function exportExcelReg(ds){
  const ExcelJS=await ensureExcelLib();
  const m=S.map[ds], rows=filtered(ds);
  const sCol=regStatusCol(ds);
  const stats=sCol?groupCount(ds,rows,m.vstatus?"vstatus":"status"):[];
  const sNames=stats.map(o=>o.name);
  const wb=new ExcelJS.Workbook();

  /* ชีทที่ 1: สรุปรายโรงงาน แยกคอลัมน์ตามสถานะรถ */
  if(m.plant){
    const g=new Map();
    rows.forEach(r=>{
      const p=keyNorm(r[m.plant])||"(ไม่ระบุ)";
      if(!g.has(p)) g.set(p,{name:p,count:0,by:{},veh:new Set()});
      const o=g.get(p); o.count++;
      if(sCol){ const st=keyNorm(r[sCol])||"(ไม่ระบุ)"; o.by[st]=(o.by[st]||0)+1; }
      if(m.vehicle){ const v=keyNorm(r[m.vehicle]); if(v) o.veh.add(v); }
    });
    const list=Array.from(g.values()).sort((a,b)=>b.count-a.count);
    const allVeh=new Set();
    if(m.vehicle) rows.forEach(r=>{const v=keyNorm(r[m.vehicle]); if(v) allVeh.add(v);});
    const ws=wb.addWorksheet("สรุปรายโรงงาน");
    const headers=["โรงงาน"].concat(sNames).concat(m.vehicle?["รวม","จำนวนรถ"]:["รวม"]);
    xlHeaderRow(ws.addRow(headers));
    list.forEach(o=>{
      const tail=m.vehicle?[o.count,o.veh.size]:[o.count];
      const row=ws.addRow([o.name].concat(sNames.map(n=>o.by[n]||0)).concat(tail));
      row.eachCell(cell=>xlCell(cell,null));
    });
    const tTail=m.vehicle?[rows.length,allVeh.size]:[rows.length];
    const totalRow=ws.addRow(["รวมทุกโรงงาน"]
      .concat(sNames.map(n=>list.reduce((a,o)=>a+(o.by[n]||0),0))).concat(tTail));
    totalRow.eachCell(cell=>{ xlCell(cell,"mid"); cell.font={bold:true}; });
    xlFitColumns(ws,headers.length);
    ws.views=[{state:"frozen",ySplit:1}];
  }

  /* ชีทที่ 2: สรุปตามสถานะรถ */
  if(sNames.length){
    const ws2=wb.addWorksheet("สรุปตามสถานะ");
    xlHeaderRow(ws2.addRow(["สถานะรถ","จำนวนรายการ","จำนวนรถ","สัดส่วน %"]));
    stats.forEach(o=>{
      const row=ws2.addRow([o.name,o.count,o.vehCount,pct(o.count,rows.length)]);
      row.eachCell(cell=>xlCell(cell,null));
    });
    xlFitColumns(ws2,4);
    ws2.views=[{state:"frozen",ySplit:1}];
  }

  /* ชีทที่ 3: ข้อมูลดิบทุกคอลัมน์ */
  const cols=S.meta[ds].metaCols;
  const ws3=wb.addWorksheet("รายละเอียด");
  xlHeaderRow(ws3.addRow(cols));
  rows.forEach(r=>{
    const row=ws3.addRow(cols.map(c=>r[c]??""));
    row.eachCell(cell=>xlCell(cell,null));
  });
  xlFitColumns(ws3,cols.length);
  ws3.views=[{state:"frozen",ySplit:1}];

  if(!wb.worksheets.length) wb.addWorksheet("ไม่มีข้อมูล");
  downloadBuf(await wb.xlsx.writeBuffer(),"Registration_"+todayStr()+".xlsx");
}

async function doExport(ds){
  const btn=$("#fCsv"); const orig=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="กำลังสร้างไฟล์…"; }
  try{
    const prof=S.meta[ds].profile;
    if(prof==="daily") await exportExcelSDA(ds);
    else if(prof==="cost") await exportExcelGPS(ds);
    else if(prof==="registry") await exportExcelReg(ds);
    else await exportExcelTraining(ds);
  }catch(e){
    alert("สร้างไฟล์ Excel ไม่สำเร็จ: "+(e&&e.message||e));
  }
  if(btn){ btn.disabled=false; btn.textContent=orig||"ดาวน์โหลด Excel"; }
}

/* ===================== แนะนำให้เปิดด้วย Google Chrome =====================
   ไม่กั้นหน้าจอ — แสดงหน้าเข้าสู่ระบบตามปกติ แล้วขึ้นแถบเตือนในการ์ดเข้าสู่ระบบ
   พร้อมปุ่มเปิด Chrome ให้ (LINE ใช้ openExternalBrowser=1 ซึ่ง LINE รองรับเอง)
   ซ่อนแถบนี้ได้ด้วยการต่อท้าย URL ว่า ?nochrome=1 */

function browserInfo(){
  const ua=navigator.userAgent||"";
  const isLine=/\bLine\//i.test(ua);
  const inApp=isLine||/FBAN|FBAV|FB_IAB|Instagram|Messenger|MicroMessenger|TikTok/i.test(ua)||/;\s*wv\)/i.test(ua);
  const isEdge=/Edg[A-Z]?\//.test(ua);
  const isOpera=/OPR\/|Opera/i.test(ua);
  const isSamsung=/SamsungBrowser/i.test(ua);
  const isFirefox=/Firefox\/|FxiOS/i.test(ua);
  const isIOS=/iPhone|iPad|iPod/i.test(ua);
  const isAndroid=/Android/i.test(ua);
  /* Chrome บน iOS ใช้ CriOS, บนแพลตฟอร์มอื่นใช้ Chrome/ */
  const chromeUA=/CriOS\//.test(ua)||/Chrome\//.test(ua);
  const isChrome=chromeUA&&!isEdge&&!isOpera&&!isSamsung&&!isFirefox&&!inApp;
  let name="เบราว์เซอร์อื่น";
  if(isLine) name="เบราว์เซอร์ในแอป LINE";
  else if(inApp) name="เบราว์เซอร์ในแอป (Facebook / IG ฯลฯ)";
  else if(isEdge) name="Microsoft Edge";
  else if(isOpera) name="Opera";
  else if(isSamsung) name="Samsung Internet";
  else if(isFirefox) name="Firefox";
  else if(/Safari\//.test(ua)&&!chromeUA) name="Safari";
  else if(isChrome) name="Google Chrome";
  return {isChrome,isIOS,isAndroid,inApp,isLine,name};
}
function chromeGate(){
  const b=browserInfo();
  if(b.isChrome) return;
  if(QS.get("nochrome")==="1") return;   /* ซ่อนแถบเตือนด้วย ?nochrome=1 */

  const box=$("#inappNotice"); if(!box) return;
  /* สำคัญ: Apps Script แสดงหน้าเว็บใน iframe ของ googleusercontent.com
     location.href จึงเป็น URL ของ iframe ไม่ใช่ลิงก์ /exec จริง ถ้าเอาไปเปิด
     ข้างนอกจะได้หน้าว่าง — ต้องใช้ URL ของเว็บแอปที่ตั้งไว้ใน CFG.apiUrl แทน */
  const inFrame=(function(){ try{ return window.top!==window.self; }catch(e){ return true; } })();
  const url=(inFrame&&CFG.apiUrl)?CFG.apiUrl:(CFG.apiUrl||location.href);
  let u;
  try{ u=new URL(url); }catch(e){ u=location; }
  const rest=u.host+u.pathname+(u.search||"");
  const scheme=(u.protocol||location.protocol).replace(":","");
  /* LINE รองรับพารามิเตอร์นี้อย่างเป็นทางการ — ใส่แล้ว LINE จะเด้งออกไปเปิด
     เบราว์เซอร์ภายนอกให้เอง เชื่อถือได้กว่า intent:// ที่มักโดนบล็อก */
  const lineUrl=url+(url.indexOf("?")>=0?"&":"?")+"openExternalBrowser=1";
  const androidIntent="intent://"+rest+"#Intent;scheme="+scheme+
    ";package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(url)+";end";
  const iosSchemes=[
    (scheme==="https"?"googlechromes://":"googlechrome://")+rest,
    "googlechrome://navigate?url="+encodeURIComponent(url)
  ];
  const isMobile=b.isAndroid||b.isIOS;

  /* วิธีทำเอง แยกตามอุปกรณ์และประเภทเบราว์เซอร์ */
  let manual="";
  if(b.isLine){
    manual='<li>แตะปุ่ม <b>⋮</b> / <b>⋯</b> มุมขวาบน (บาง iPhone อยู่ขวาล่าง)</li>'+
           '<li>เลือก <b>“เปิดในเบราว์เซอร์อื่น”</b> / <b>“Open in other browser”</b></li>'+
           '<li>ถ้าถามว่าเปิดด้วยอะไร ให้เลือก <b>Chrome</b></li>';
  }else if(b.inApp){
    manual='<li>แตะปุ่ม <b>⋮</b> หรือ <b>⋯</b> ของแอป</li>'+
           '<li>เลือก <b>“เปิดในเบราว์เซอร์”</b></li>'+
           '<li>ถ้าถามว่าเปิดด้วยอะไร ให้เลือก <b>Chrome</b></li>';
  }else if(isMobile){
    manual='<li>กด <b>คัดลอกลิงก์</b></li><li>เปิดแอป <b>Chrome</b></li>'+
           '<li>วางลิงก์ในช่องที่อยู่เว็บ แล้วกดไป</li>';
  }else{
    manual='<li>กด <b>คัดลอกลิงก์</b></li><li>เปิดโปรแกรม <b>Google Chrome</b></li>'+
           '<li>วางลิงก์ในช่องที่อยู่เว็บ แล้วกด Enter</li>';
  }

  let acts="";
  if(b.isLine) acts+='<a class="btn btn-primary btn-sm" target="_top" href="'+esc(lineUrl)+'">เปิดใน Google Chrome</a>';
  else if(isMobile) acts+='<button class="btn btn-primary btn-sm" id="cgOpen">เปิดใน Google Chrome</button>';
  acts+='<button class="btn btn-sm" id="cgCopy">คัดลอกลิงก์</button>';

  box.innerHTML=
    '<div>คุณกำลังเปิดเว็บนี้ด้วย <b>'+esc(b.name)+'</b> — แนะนำให้เปิดด้วย <b>Google Chrome</b> '+
    'เพื่อให้การจดจำรหัสผ่านและการดาวน์โหลด Excel ทำงานได้ครบถ้วน</div>'+
    '<div class="inapp-acts">'+acts+'</div>'+
    '<button class="inapp-more" id="cgHelp">ดูวิธีเปิดเอง</button>'+
    '<ol class="inapp-steps hide" id="cgManual">'+manual+
      '<li>หรือคัดลอกลิงก์นี้ไปเปิดเอง<div class="inapp-link" id="cgUrl">'+esc(url)+'</div></li></ol>';
  box.hidden=false;

  /* ลองเปิด Chrome — เบราว์เซอร์ในแอปมักบล็อกเงียบ ๆ ไม่แจ้ง error
     จึงเช็คว่าผ่านไปแล้วยังอยู่หน้าเดิมไหม ถ้ายังอยู่ = เปิดไม่สำเร็จ ให้โชว์วิธีทำเอง */
  const openBtn=$("#cgOpen");
  if(openBtn) openBtn.onclick=()=>{
    let left=false;
    const onHide=()=>{ if(document.hidden) left=true; };
    document.addEventListener("visibilitychange",onHide);
    if(b.isAndroid){ location.href=androidIntent; }
    else{
      location.href=iosSchemes[0];
      setTimeout(()=>{ if(!left&&!document.hidden) location.href=iosSchemes[1]; },700);
    }
    setTimeout(()=>{
      document.removeEventListener("visibilitychange",onHide);
      if(left||document.hidden) return;
      const mb=$("#cgManual"); if(mb) mb.classList.remove("hide");
      openBtn.textContent="เปิดไม่สำเร็จ — ดูวิธีด้านล่าง";
    },1800);
  };
  const help=$("#cgHelp");
  if(help) help.onclick=()=>{
    const mb=$("#cgManual");
    if(mb){ mb.classList.toggle("hide"); help.textContent=mb.classList.contains("hide")?"ดูวิธีเปิดเอง":"ซ่อนวิธีเปิดเอง"; }
  };
  const copy=$("#cgCopy");
  if(copy) copy.onclick=async()=>{
    try{
      await navigator.clipboard.writeText(url);
      copy.textContent="คัดลอกแล้ว ✓";
    }catch(e){
      copy.textContent="คัดลอกไม่ได้ — กดค้างที่ลิงก์";
    }
    setTimeout(()=>{ copy.textContent="คัดลอกลิงก์"; },2600);
  };
}
chromeGate();

boot();
